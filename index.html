function buildIce() {
  const skin = new THREE.MeshStandardMaterial({ color: 0x0d3252, emissive: 0x1a63ff,
    emissiveIntensity: 0.34, roughness: 0.13, metalness: 0.45, flatShading: true, envMapIntensity: 1.35 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x123c60, emissive: 0x59d2ff,
    emissiveIntensity: 0.7, roughness: 0.05, metalness: 0.5, flatShading: true,
    envMapIntensity: 1.7, transparent: true, opacity: 0.93 });
  const eyeM = new THREE.MeshStandardMaterial({ color: 0x0a2233, emissive: 0x9fe8ff, emissiveIntensity: 3.4 });

  bossLeg(-1, skin, glass); bossLeg(1, skin, glass);
  const torso = mesh(new THREE.OctahedronGeometry(1.06, 0), skin);
  torso.position.y = 2.0; torso.scale.set(0.92, 1.28, 0.88);
  const shoulders = mesh(new THREE.OctahedronGeometry(0.62, 0), glass);
  shoulders.position.y = 2.62; shoulders.scale.set(1.7, 0.6, 0.85);
  B.group.add(torso, shoulders);

  /* The core: a bright seed inside a cage of ice, so the light reads as
     something burning *behind* the crystal rather than a lamp on its face. */
  const core = mesh(new THREE.IcosahedronGeometry(0.3, 1),
    new THREE.MeshStandardMaterial({ color: 0xbfefff, emissive: 0x9fe8ff, emissiveIntensity: 5.5 }));
  core.position.set(0, 2.08, 0.12);
  const coreLight = new THREE.PointLight(0x7fd8ff, 30, 12, 2);
  coreLight.position.set(0, 2.1, 0.4);
  B.group.add(core, coreLight);

  /* Eight shards in slow orbit. They are the boss's silhouette in motion. */
  for (let i = 0; i < 8; i++) {
    const s = mesh(new THREE.OctahedronGeometry(0.13 + Math.random() * 0.1, 0), glass);
    B.group.add(s);
    B.shards.push({ m: s, a: (i / 8) * Math.PI * 2, r: 1.45 + (i % 3) * 0.28,
      y: 0.4 + (i % 4) * 0.62, sp: 0.25 + (i % 3) * 0.12 });
  }
  const head = mesh(new THREE.OctahedronGeometry(0.46, 0), skin);
  head.position.y = 3.02; head.scale.set(0.95, 1.1, 0.95);
  B.eyes = new THREE.Group();
  const visor = mesh(new THREE.BoxGeometry(0.52, 0.09, 0.06), eyeM);
  visor.position.set(0, 3.05, 0.4);
  B.eyes.add(visor);
  const eyeLight = new THREE.PointLight(0x8fe4ff, 14, 7, 2);
  eyeLight.position.set(0, 3.0, 0.6);
  B.eyes.add(eyeLight);
  B.group.add(head, B.eyes);
  for (let i = 0; i < 5; i++) {                    // crest, fanning back
    const c = mesh(new THREE.ConeGeometry(0.11, 0.86 - i * 0.08, 5), glass);
    const a = (i - 2) * 0.32;
    c.position.set(a * 0.55, 3.46, -0.18);
    c.rotation.set(-0.5, 0, a);
    B.group.add(c);
  }
  spikes(3, 0.2, 0.76, glass, -1.22, 2.66, 0, 1);
  spikes(3, 0.2, 0.76, glass, 1.22, 2.66, 0, 1);
  B.parts.armL = bossLimb(-1, 2.46, 0.24, skin, glass);
  B.parts.armR = bossLimb(1, 2.46, 0.24, skin, glass);
  B.parts.head = head; B.parts.torso = torso;
  B.core = core;
  B.parts.claw = glass;
}

/* ---- assemble / tear down ------------------------------------------------- */
function clearBoss() {
  B.group.traverse((o) => {
    if (o.isMesh) { o.geometry.dispose(); if (o.material && o.material !== MAT.body) o.material.dispose(); }
  });
  B.group.clear();
  B.flames = []; B.shards = []; B.parts = {}; B.eyes = null; B.core = null;
}
function spawnBoss(plan) {
  clearBoss();
  B.def = plan.def; B.plan = plan; B.hp = plan.hp; B.maxHp = plan.hp;
  B.st = LOGIC.bossInit(plan, RNG);
  B.dead = false; B.t = 0; B.hitFlash = 0;
  B.group.position.set(BX, 0, BZ);
  B.group.rotation.set(0, 0, 0);
  B.group.scale.setScalar(0.001);
  if (plan.def.id === 'demon') buildDemon(); else buildIce();
  const warm = plan.def.id === 'demon' ? 0xff6a12 : 0x7fd8ff;
  ring({ x: BX, z: BZ, color: warm, r0: 0.4, r1: 7, life: 0.85 });
  burst({ x: BX, y: 0.4, z: BZ, count: 46, color: warm, speed: 6, spread: 1,
    size: 0.3, life: 1.1, grav: 1.5, drag: 1.4, up: 1.2 });
  shake(0.5); flash(0.25);
}

/* ---- the warning zone ---------------------------------------------------- */
/* A painted half-disc: hazard hatch, a bright rim, and a pulse that tightens
   as the strike approaches. Its job is to be impossible to misread. */
function warnTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(256, 256, 30, 256, 256, 254);
  grd.addColorStop(0.00, 'rgba(255,60,60,0.16)');
  grd.addColorStop(0.65, 'rgba(255,30,30,0.26)');
  grd.addColorStop(1.00, 'rgba(255,0,0,0.52)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(256, 256, 254, 0, Math.PI * 2); g.fill();
  g.save(); g.beginPath(); g.arc(256, 256, 254, 0, Math.PI * 2); g.clip();
  g.strokeStyle = 'rgba(0,0,0,0.20)'; g.lineWidth = 7;       // warning stripes
  for (let i = -512; i < 1024; i += 34) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 512, 512); g.stroke();
  }
  g.strokeStyle = 'rgba(255,190,190,0.26)'; g.lineWidth = 2.5;
  for (let r = 46; r < 250; r += 46) { g.beginPath(); g.arc(256, 256, r, 0, Math.PI * 2); g.stroke(); }
  g.restore();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const warnZone = new THREE.Group();
const warnGeo = new THREE.CircleGeometry(R, 56, 0, Math.PI);   // local +x half
const warnMat = new THREE.MeshBasicMaterial({ map: warnTexture(), transparent: true,
  opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const warnDisc = new THREE.Mesh(warnGeo, warnMat);
warnDisc.rotation.x = -Math.PI / 2;
warnDisc.position.y = 0.03;
const warnRim = new THREE.Mesh(new THREE.TorusGeometry(R * 0.995, 0.075, 5, 40, Math.PI),
  new THREE.MeshBasicMaterial({ color: 0xff5544, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
warnRim.rotation.x = -Math.PI / 2;
warnRim.position.y = 0.05;
warnZone.add(warnDisc, warnRim);
warnZone.visible = false;
world.add(warnZone);

function warnShow(side) {
  warnZone.rotation.y = side === 'right' ? 0 : Math.PI;
  warnZone.visible = true;
  warnZone.scale.setScalar(0.55);
  ring({ x: 0, z: 0, color: 0xff3322, r0: 0.5, r1: R + 1, life: 0.7 });
}

/* ---- ice shards: a small pool of crystal spikes that erupt and sink ------- */
const shardGeo = new THREE.OctahedronGeometry(0.26, 0);
const shardPal = [];
for (let i = 0; i < 16; i++) {
  const m = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({ color: 0x9fe8ff,
    emissive: 0x59d2ff, emissiveIntensity: 1.3, roughness: 0.1, metalness: 0.4, flatShading: true }));
  m.visible = false;
  world.add(m);
  shardPal.push({ m, t: 1, life: 1, x: 0, z: 0, h: 2, sp: 0 });
}
function shardsAt(x, z, n, color) {
  for (let k = 0; k < n; k++) {
    let s = shardPal.find((p) => p.t >= 1);
    if (!s) s = shardPal[k % shardPal.length];
    s.t = 0; s.life = 0.9 + Math.random() * 0.5;
    s.x = x + (Math.random() - 0.5) * 2.4;
    s.z = z + (Math.random() - 0.5) * 2.4;
    s.h = 2.2 + Math.random() * 2.6;
    s.sp = 1.4 + Math.random() * 3.4;
    s.m.material.color.set(color);
    s.m.material.emissive.set(color);
    s.m.visible = true;
  }
}
function updateShards(dt) {
  for (const s of shardPal) {
    if (s.t >= 1) { if (s.m.visible) s.m.visible = false; continue; }
    s.t = Math.min(1, s.t + dt / s.life);
    const up = Math.sin(s.t * Math.PI * 0.55);
    s.m.position.set(s.x, up * s.h, s.z);
    s.m.rotation.set(s.t * s.sp, s.t * s.sp * 1.6, s.t * 0.5);
    s.m.scale.setScalar(0.5 + up * 1.1);
  }
}

/* ---- the strike itself --------------------------------------------------- */
/* Everything the boss does on the turn is telegraphed, aimed, and loud. */
function bossStrikeFx(side, isIce) {
  const dir = side === 'right' ? 0 : Math.PI;
  const col = isIce ? 0x7fe0ff : 0xff6a12;
  const x = side === 'right' ? 2.6 : -2.6;
  arc({ x: BX, y: isIce ? 1.0 : 1.35, z: BZ + 1.4, yaw: dir, r0: 1.4, r1: 6.4, life: 0.42, flat: 1, color: col });
  arc({ x: BX, y: isIce ? 1.9 : 2.2, z: BZ + 1.4, yaw: dir, r0: 1.0, r1: 4.6, life: 0.34, flat: 0.72, color: isIce ? 0xd6f6ff : 0xffd166 });
  ring({ x: BX * 0.3, z: BZ + 1.6, color: col, r0: 0.6, r1: R + 0.6, life: 0.6 });
  burst({ x: x * 0.75, y: 1.0, z: BZ + 1.6, count: 70, color: col, speed: 11, spread: 1,
    size: isIce ? 0.2 : 0.34, life: 0.85, grav: isIce ? -8 : 3.5, drag: 1.5, up: isIce ? 0 : 0.7 });
  if (isIce) shardsAt(BX + x * 0.55, BZ + 1.8, 7, 0x9fe8ff);
  else {
    burst({ x: x * 0.75, y: 0.2, z: BZ + 1.6, count: 40, color: 0xff9a2e, speed: 7, spread: 1,
      size: 0.4, life: 0.6, grav: -1, drag: 1.2, up: 1.6 });
    shardPal.length && shardsAt(BX + x * 0.55, BZ + 1.8, 4, 0xff7a1e);
  }
  flash(isIce ? 0.1 : 0.14);
  shake(isIce ? 0.7 : 0.85);
  hitStop(0.05);
}

/* ---- the boss's frame ---------------------------------------------------- */
/* One function drives both bosses: it advances the pure state machine, reacts
   to the events it emits, and animates the same part names regardless of which
   body is currently standing there. */
function bossAmbient(dt) {
  const demon = B.def.id === 'demon';
  const r = () => Math.random();
  if (demon) {
    burst({ x: BX + (r() - 0.5) * 1.6, y: 1.2 + r() * 1.8, z: BZ + (r() - 0.5) * 1.2,
      count: 2, color: r() < 0.5 ? 0xff5a12 : 0xffc247, speed: 1.6, spread: 0.5,
      size: 0.2, life: 0.7, grav: 2.4, drag: 1.1, up: 1 });
  } else {
    burst({ x: BX + (r() - 0.5) * 2.4, y: 0.15 + r() * 0.4, z: BZ + (r() - 0.5) * 2.4,
      count: 1, color: 0x9fe8ff, speed: 0.7, spread: 0.6, size: 0.18, life: 1.5,
      grav: 0.35, drag: 1.9 });
  }
}

function updateBoss(dt) {
  if (B.dead) {                                   // the corpse implodes and spins out
    const s = B.group.scale.x;
    if (s > 0.02) {
      B.group.scale.setScalar(s * Math.max(0, 1 - dt * 3.4));
      B.group.rotation.y += dt * 7;
      B.group.rotation.x = LOGIC.damp(B.group.rotation.x, 0, 6, dt);
    }
    return;
  }
  B.t += dt;
  B.group.scale.setScalar(LOGIC.damp(B.group.scale.x, BS, 7, dt));   // spawn pop-in
  B.hitFlash = Math.max(0, B.hitFlash - dt * 4);
  const e = B.st;

  for (const ev of LOGIC.bossStep(e, dt)) {
    if (ev.type === 'telegraph') {
      warnShow(ev.side); shake(0.05);
      /* The countdown you can hear as well as see, panned to the side that is
         about to be lit up — and the music leans in with it. */
      AUDIO.setHeat(Math.min(1, heatOf(G.slain) + 0.2));
      AUDIO.play('warn', { pan: ev.side === 'right' ? 0.5 : -0.5 });
    } else if (ev.type === 'strike') {
      warnZone.visible = false;
      AUDIO.setHeat(heatOf(G.slain));
      bossStrikeFx(ev.side, B.def.id === 'ice');
      /* The whole game, right here: safe means the other half. */
      if (!LOGIC.isSafe(ev.side, P.side)) hurtPlayer(B.plan.dmg);
      else {
        AUDIO.play('avoid', { pan: ev.side === 'right' ? -0.4 : 0.4 });
        after(0.05, () => { if (!B.dead) dmgNumber({ x: 0, y: 2.6, z: CFG.pz, value: 'DODGE',
          life: 0.7, magic: true }); });
      }
    } else if (ev.type === 'recover') warnZone.visible = false;
  }

  /* warning zone: charges up, and throws sparks while it does */
  if (e.phase === 'telegraph') {
    const u = LOGIC.telegraphT(e);
    warnMat.opacity = 0.16 + u * 0.3;
    warnRim.material.opacity = 0.25 + u * 0.5;
    warnZone.scale.setScalar(LOGIC.lerp(0.5, 1, Math.min(1, u * 2.4)));
    if (Math.random() < 0.55) {
      const sx = (e.side === 'right' ? 1 : -1) * (1 + Math.random() * 7);
      const sz = (Math.random() - 0.5) * 16;
      burst({ x: sx, y: 0.1, z: sz, count: 1, color: B.def.id === 'ice' ? 0x9fe8ff : 0xff6a3a,
        speed: 2.2, spread: 0.3, size: 0.16, life: 0.6, grav: 1.6, drag: 1.6, up: 1 });
    }
  }

  /* pose: wind up over the armed side, slam forward on the strike */
  /* Signs are mirrored from the player's: this body faces +z, so raising an
     arm up and behind it is a positive rotation about X. */
  let arm = 0;
  if (e.phase === 'telegraph') arm = 2.35 * Math.min(1, LOGIC.telegraphT(e) * 1.7);
  else if (e.phase === 'strike') arm = -1.25;
  const g = e.side === 'left' ? B.parts.armL.g : B.parts.armR.g;
  const other = e.side === 'left' ? B.parts.armR.g : B.parts.armL.g;
  g.rotation.x = LOGIC.damp(g.rotation.x, arm, 15, dt);
  other.rotation.x = LOGIC.damp(other.rotation.x, arm * 0.25, 10, dt);
  const lean = e.phase === 'strike' ? 0.17 : (e.phase === 'telegraph' ? -0.09 : 0);
  B.group.rotation.x = LOGIC.damp(B.group.rotation.x, lean, 9, dt);
  /* A hit makes it flinch; a breather makes it breathe. */
  const breathe = Math.sin(B.t * 1.5) * 0.5 + 0.5;
  const base = B.def.id === 'demon' ? [0.94, 1.12, 0.88] : [0.92, 1.28, 0.88];
  B.parts.torso.scale.set(base[0] + breathe * 0.03, base[1] + breathe * 0.04, base[2] - breathe * 0.02);
  B.parts.head.rotation.x = Math.sin(B.t * 1.1) * 0.06 - B.group.rotation.x * 0.5;
  B.group.rotation.z = Math.sin(B.t * 42) * 0.022 * B.hitFlash;

  if (B.def.id === 'demon') {
    for (const f of B.flames) {
      const w = 0.16 + 0.09 * Math.sin(B.t * 5 + f.seed) + 0.05 * Math.sin(B.t * 11.3 + f.seed * 3);
      f.m.material.opacity = Math.max(0.04, w);
      f.m.scale.setScalar(1 + f.seed * 0.02 + Math.sin(B.t * 3.4 + f.seed) * 0.07);
      f.m.rotation.y += dt * 0.4;
    }
    if (B.core) B.core.material.emissiveIntensity = 1.5 + Math.sin(B.t * 4.2) * 0.5;
  } else {
    for (const s of B.shards) {
      s.a += dt * s.sp;
      s.m.position.set(Math.cos(s.a) * s.r, s.y + Math.sin(B.t * 1.4 + s.a) * 0.16, Math.sin(s.a) * s.r);
      s.m.rotation.set(s.a, s.a * 2, 0);
    }
    if (B.core) {
      B.core.rotation.y += dt * 0.8;
      B.core.material.emissiveIntensity = 5 + Math.sin(B.t * 2.6) * 1.6;
      B.core.scale.setScalar(1 + Math.sin(B.t * 2.6) * 0.06);
    }
  }
  bossAmbient(dt);
}

/* ============================== the fight ================================= */
const G = {
  state: 'fight',           // fight | victory | defeat
  t: 0, combo: 0, lastHit: -99, best: 0, slain: 0,
  hits: 0, dodges: 0, runT: 0,
};
const bannerEl = document.getElementById('banner');
const overEl = document.getElementById('over');
function banner(title, sub, cls, dur) {
  bannerEl.querySelector('b').textContent = title;
  bannerEl.querySelector('i').textContent = sub || '';
  bannerEl.className = cls + ' on';
  clearTimeout(bannerEl._t);
  bannerEl._t = setTimeout(() => { bannerEl.className = cls; }, dur || 1500);
}

/* A boss walks in bigger and meaner each time, and so does the music: `heat`
   thickens the drums and pushes the lead forward as the waves stack up. */
const heatOf = (slain) => Math.min(1, 0.25 + slain * 0.2);

/* A new boss walks in: never the same one twice, always meaner than the last. */
function nextWave() {
  const def = LOGIC.rollBoss(RNG, B.def ? B.def.id : null);
  const plan = LOGIC.planFor(def, G.slain);
  spawnBoss(plan);
  G.state = 'fight';
  G.combo = 0;
  G.lastHit = -99;
  hudBoss(plan);
  hudCombo(0);
  /* The score follows the boss: its own key, its own colour of lead. */
  AUDIO.setElement(def.id);
  AUDIO.setHeat(heatOf(G.slain));
  AUDIO.play('wave');
  AUDIO.music(true);
  banner(def.name, def.title + ' — WAVE ' + (G.slain + 1), 'wave', 1900);
}

/* ---- dealing it out ------------------------------------------------------ */
function damageBoss(move, pos, tint) {
  if (B.dead || G.state !== 'fight') return;
  const r = LOGIC.hitFor(move, G.combo, RNG);
  /* Every blow is heard from the side it was thrown from. */
  const pan = LOGIC.clamp(P.x / CFG.slot, -1, 1) * 0.45;
  G.combo = LOGIC.comboAfterHit(G.combo, G.t, G.lastHit);
  G.lastHit = G.t;
  if (G.combo > G.best) G.best = G.combo;
  B.hp = Math.max(0, B.hp - r.amount);
  B.hitFlash = Math.min(1, B.hitFlash + (r.crit ? 0.9 : 0.45));
  G.hits++;
  hitSpark(pos, tint || 0x9ff0ff, r.crit || move === 'heavy');
  AUDIO.play(r.crit ? 'crit' : 'hit', { pan, gain: move === 'heavy' ? 1 : 0.8 });
  if (G.combo > 1) AUDIO.play('combo', { n: G.combo });
  dmgNumber({ x: pos.x, y: pos.y + 0.35, z: pos.z, value: r.amount, crit: r.crit, magic: move === 'bolt' });
  hudCombo(G.combo);
  hudBossHit();
  if (r.crit || move === 'heavy') {
    shake(move === 'heavy' ? 0.8 : 0.5);
    slowmo(0.34, move === 'heavy' ? 0.34 : 0.22);   // the beat that sells a big hit
    flash(0.09);
    AUDIO.duck(move === 'heavy' ? 0.5 : 0.36, 0.32);   // make room for the crunch
  } else shake(0.19);
  if (B.hp <= 0) killBoss();
}

function killBoss() {
  B.dead = true;
  warnZone.visible = false;
  G.state = 'victory';
  G.slain++;
  const isIce = B.def.id === 'ice';
  const col = isIce ? 0x9fe8ff : 0xff7a1e;
  burst({ x: BX, y: 2, z: BZ, count: 120, color: col, speed: 14, spread: 1, size: 0.34,
    life: 1.3, grav: -3, drag: 1.1 });
  burst({ x: BX, y: 2, z: BZ, count: 60, color: 0xffffff, speed: 7, spread: 1, size: 0.5,
    life: 0.9, grav: 1.2, drag: 1.5 });
  ring({ x: BX, z: BZ, color: col, r0: 0.5, r1: 13, life: 0.9 });
  ring({ x: BX, z: BZ, y: 1.4, color: 0xffffff, r0: 0.4, r1: 6, life: 0.6, tilt: 0 });
  shardsAt(BX, BZ, 12, col);
  flash(0.34); shake(1.25); slowmo(0.22, 1.1); hitStop(0.09);
  /* The biggest noise in the game, and the music steps right off the stage. */
  AUDIO.play('kill');
  AUDIO.duck(0.7, 1.1);
  /* Surviving is a reprieve, not a reset: patch up, then meet the next one. */
  const heal = Math.min(28, P.maxHp - P.hp);
  P.hp += heal; G.healed += heal;
  hudPlayer();
  banner('VICTORY', B.def.name + ' FALLS' + (heal ? '  ·  +' + heal + ' HP' : ''), 'win', 1700);
  after(2.3, nextWave);
}

function hurtPlayer(dmg) {
  if (G.state !== 'fight') return;
  P.hp = LOGIC.incoming(dmg, P.hp);
  G.combo = 0;
  G.lastHit = -99;
  hudCombo(0);
  hudPlayer();
  P.hitFlash = 1;
  vignette(0.6); shake(0.95); hitStop(0.07); flash(0.08);
  AUDIO.play('hurt', { gain: 1 });
  AUDIO.duck(0.45, 0.35);
  burst({ x: P.x, y: 1.1, z: CFG.pz, count: 26, color: 0xff4a5e, speed: 7, spread: 1,
    size: 0.22, life: 0.6, grav: -3, drag: 1.6 });
  dmgNumber({ x: P.x, y: 2.15, z: CFG.pz + 0.4, value: dmg, hurt: true });
  if (P.hp <= 0) defeat();
}

function defeat() {
  G.state = 'defeat';
  warnZone.visible = false;
  if (!B.dead) { B.plan = { ...B.plan, recover: 3 }; B.st.phase = 'idle'; B.st.t = -3; }
  slowmo(0.25, 1.6);
  shake(1);
  flash(0.3);
  /* The loop drops out and leaves one long minor chord to lose to. */
  AUDIO.music(false);
  AUDIO.play('defeat');
  burst({ x: P.x, y: 1.2, z: CFG.pz, count: 80, color: 0xff5468, speed: 9, spread: 1,
    size: 0.3, life: 1.4, grav: -5, drag: 1.2 });
  overEl.querySelector('h1').textContent = 'DEFEATED';
  overEl.querySelector('.stats').innerHTML =
    `<div><b>${G.slain}</b>BOSSES FELLED</div><div><b>${G.hits}</b>HITS LANDED</div>` +
    `<div><b>${G.best}</b>BEST COMBO</div><div><b>${G.runT.toFixed(1)}s</b>SURVIVED</div>`;
  overEl.className = 'lose on';
}

/* ---- new run ------------------------------------------------------------- */
function newRun() {
  clearTimers();
  overEl.className = '';
  bannerEl.className = '';
  G.state = 'fight'; G.combo = 0; G.lastHit = -99; G.best = 0; G.slain = 0;
  G.hits = 0; G.runT = 0;
  P.hp = P.maxHp; P.x = CFG.slot; P.targetX = CFG.slot; P.side = LOGIC.sideOf(P.x);
  P.group.position.set(P.x, 0, CFG.pz);
  P.group.rotation.set(0, 0, 0);
  P.atk.name = null;
  for (const k in P.readyAt) P.readyAt[k] = 0;
  B.dead = true; clearBoss();
  hudPlayer(); hudCombo(0);
  nextWave();
}

/* ============================ the player's frame ========================== */
const TINT = { quick: new THREE.Color(0x9ff0ff), heavy: new THREE.Color(0xffd166), bolt: new THREE.Color(0xc79bff) };
const _hit = new THREE.Vector3();
let pLunge = 0;

/* A dodge commits the instant it is pressed: the side you are on is what the
   strike tests against, so the feet are only ever catching up to a decision
   that has already been made. */
function tryMove(dir) {
  if (G.state === 'defeat' || P.dodgeT < 0.1) return;
  const nx = dir < 0 ? -CFG.slot : CFG.slot;
  if (nx === P.targetX) return;
  P.targetX = nx;
  P.side = LOGIC.sideOf(nx);
  P.dodgeT = 0;
  G.dodges++;
  AUDIO.play('dodge', { pan: dir * 0.6 });
  ring({ x: P.x, z: CFG.pz, color: 0x6ff2ff, r0: 0.3, r1: 2.4, life: 0.35 });
  burst({ x: P.x, y: 0.7, z: CFG.pz, count: 16, color: 0x6ff2ff, speed: 3.4, spread: 0.8,
    size: 0.16, life: 0.45, grav: -0.6, drag: 2.4, dir: [dir * 1.6, 0.5, 0], up: 0.3 });
}

function tryAttack(name) {
  if (G.state !== 'fight' || B.dead) return;
  if (!LOGIC.isReady(G.t, P.readyAt[name])) return;
  if (P.atk.name && P.atk.t < 0.1) return;      // no machine-gunning one key
  const a = LOGIC.ACTIONS[name];
  P.atk = { name, t: 0, dur: a.hit + 0.26, hit: false };
  P.readyAt[name] = LOGIC.readyAt(G.t, a.cd);
  P.aura = 1;
  /* The swing you hear is the wind-up; the impact lands later, in damageBoss,
     where it belongs. */
  AUDIO.play(name === 'quick' ? 'slash' : name === 'bolt' ? 'boltCast' : 'heavy',
    { pan: LOGIC.clamp(P.x / CFG.slot, -1, 1) * 0.45 });
}

/* Where a swing actually lands: at the boss's near flank, in front of you. */
function resolveHit(name) {
  const tint = TINT[name].getHex();
  if (name === 'bolt') {
    P.group.updateMatrixWorld(true);
    swordTip.getWorldPosition(ribA);
    bolt({ from: new THREE.Vector3(ribA.x * 0.6, 1.55, ribA.z), to: new THREE.Vector3(BX, 1.9, BZ + 0.9),
      color: tint, dur: 0.3,
      onHit: (p) => { AUDIO.play('bolt', { pan: -0.35 }); damageBoss('bolt', p, tint); } });
    return;
  }
  _hit.set(P.x * 0.3, 1.8, BZ + 1.5);
  burst({ x: P.x, y: 1.5, z: CFG.pz - 0.7, count: 10, color: tint, speed: 4, spread: 0.7,
    size: 0.16, life: 0.3, grav: -2, drag: 2 });
  /* The crescent of the swing, thrown from the player toward the boss. */
  arc({ x: P.x * 0.5, y: name === 'heavy' ? 0.95 : 1.5, z: CFG.pz - 1.1, yaw: Math.PI / 2,
    r0: 0.9, r1: name === 'heavy' ? 6.2 : 4.2, life: name === 'heavy' ? 0.45 : 0.28,
    flat: name === 'heavy' ? 1 : 0.5, color: tint });
  if (name === 'heavy') {
    ring({ x: P.x * 0.4, z: CFG.pz - 1.6, color: tint, r0: 0.5, r1: 8, life: 0.55 });
    shardsAt(P.x * 0.5, CFG.pz - 1.7, 5, tint);
    burst({ x: P.x * 0.4, y: 0.1, z: CFG.pz - 1.7, count: 30, color: 0xffb347, speed: 8,
      spread: 1, size: 0.28, life: 0.7, grav: -6, drag: 1.4, up: 1.2 });
    shake(0.4); hitStop(0.04);
  }
  damageBoss(name, _hit, tint);
}

function updatePlayer(dt, t) {
  const px0 = P.x;
  P.dodgeT += dt;
  if (G.state !== 'defeat') {
    /* The dash is fast, the settle is slow: that is the whole feel of a dodge. */
    P.x = LOGIC.damp(P.x, P.targetX, P.dodgeT < 0.3 ? 24 : 11, dt);
    if (Math.abs(P.x - P.targetX) < 0.008) P.x = P.targetX;
  }
  P.vworld.set(dt > 1e-5 ? (P.x - px0) / dt : 0, 0, 0);
  P.group.position.x = P.x;
  P.group.rotation.z = LOGIC.damp(P.group.rotation.z, -(P.targetX - P.x) * 0.14, 14, dt);

  /* attack timeline: wind up, land the blow, recover */
  let u = 0, name = null, a = null;
  if (P.atk.name) {
    name = P.atk.name; a = LOGIC.ACTIONS[name];
    P.atk.t += dt;
    u = LOGIC.clamp(P.atk.t / P.atk.dur, 0, 1);
    if (!P.atk.hit && P.atk.t >= a.windup) { P.atk.hit = true; resolveHit(name); }
    if (P.atk.t >= P.atk.dur) P.atk.name = null;
  }

  /* the arm does the talking */
  const R = armR.g, wind = 0.34;
  if (a) {
    if (name === 'bolt') {
      R.rotation.x = LOGIC.lerp(-0.7, 1.15, Math.min(1, u / 0.35));
      R.rotation.z = -0.14;
    } else {
      const k = u < wind ? u / wind : (u - wind) / (1 - wind);
      const s = k * k * (3 - 2 * k);                       // smoothstep the cut
      R.rotation.x = u < wind ? LOGIC.lerp(0.2, -2.55, k) : LOGIC.lerp(-2.55, 1.35, s);
      R.rotation.z = -0.14 - Math.sin(u * Math.PI) * (name === 'heavy' ? 0.6 : 0.4);
    }
    armL.g.rotation.x = Math.sin(u * Math.PI) * (name === 'heavy' ? -0.75 : -0.45);
    legR.rotation.x = -Math.sin(u * Math.PI) * (name === 'heavy' ? 0.45 : 0.2);
    torso.rotation.y = Math.sin(u * Math.PI) * (name === 'heavy' ? 0.34 : 0.2);
  } else {
    R.rotation.x = LOGIC.damp(R.rotation.x, 0.12 + Math.sin(t * 1.6) * 0.07, 8, dt);
    R.rotation.z = LOGIC.damp(R.rotation.z, -0.14, 8, dt);
    armL.g.rotation.x = LOGIC.damp(armL.g.rotation.x, Math.sin(t * 1.6) * 0.06, 6, dt);
    legR.rotation.x = LOGIC.damp(legR.rotation.x, 0, 8, dt);
    torso.rotation.y = LOGIC.damp(torso.rotation.y, Math.sin(t * 0.9) * 0.05, 6, dt);
  }
  /* a small lunge toward the boss, so melee has weight behind it */
  const lungeTo = a && name !== 'bolt' ? (name === 'heavy' ? 0.6 : 0.3) * Math.sin(u * Math.PI) : 0;
  pLunge = LOGIC.damp(pLunge, lungeTo, 13, dt);
  P.group.position.z = CFG.pz - pLunge;
  P.group.position.y = Math.sin(t * 2.1) * 0.014;
  torso.scale.y = 1 + Math.sin(t * 2.1) * 0.02;
  head.rotation.y = Math.sin(t * 0.8) * 0.1;

  /* energy aura pulses with every action, and turns red when you are hit */
  P.aura = Math.max(0, P.aura - dt * 2.6);
  P.hitFlash = Math.max(0, P.hitFlash - dt * 2.4);
  const pulse = P.aura + P.hitFlash * 0.7;
  auraMat.opacity = 0.02 + pulse * 0.09;
  auraMat.color.set(P.hitFlash > 0.25 ? 0xff4a5e : 0x3fd8ff);
  aura.scale.set(0.85 + pulse * 0.14, 1.25 + pulse * 0.16, 0.85 + pulse * 0.14);
  auraRing.material.opacity = 0.2 + pulse * 0.6;
  auraRing.scale.setScalar(1 + pulse * 0.4);
  MAT.eye.emissiveIntensity = 3.6 + Math.sin(t * 3) * 0.7 + P.aura * 2.4;
  bladeGlow.intensity = 3.5 + P.aura * 7;

  /* the blade ribbon is sampled straight off the sword's world matrix */
  const swinging = a && name !== 'bolt' && u > 0.15;
  if (swinging) {
    P.group.updateMatrixWorld(true);
    swordTip.getWorldPosition(ribA);
    swordBase.getWorldPosition(ribB);
    ribbonUpdate(dt, ribA, ribB, TINT[name]);
  } else ribbonUpdate(dt, null, null, null);

  capeUpdate(dt, t);
}

/* ================================= HUD =================================== */
const el = {
  bossName: document.getElementById('bossName'), dot: document.getElementById('bossDot'),
  wave: document.getElementById('bossWave'), bar: document.getElementById('bossBar'),
  bossFill: document.getElementById('bossHpFill'), bossLag: document.getElementById('bossHpLag'),
  spark: document.getElementById('bossSpark'), pFill: document.getElementById('pHpFill'),
  pLag: document.getElementById('pHpLag'), pPanel: document.getElementById('pPanel'),
  pTag: document.getElementById('pTag'), combo: document.getElementById('combo'),
  comboN: document.getElementById('comboN'),
  slots: Array.from(document.querySelectorAll('.slot')),
};
function hudBoss(plan) {
  const warm = plan.def.id === 'demon';
  /* The title is its own element so a phone can drop it: "PYROTH" always fits,
     "PYROTH — THE FLAME DEMON" does not. */
  el.bossName.querySelector('b').textContent = plan.def.name;
  el.bossName.querySelector('.ttl').textContent = ' — ' + plan.def.title;
  el.bossName.style.color = warm ? '#ffb488' : '#aee9ff';
  el.dot.style.color = el.dot.style.background = warm ? '#ff6a1e' : '#5fd0ff';
  el.bossFill.classList.toggle('ice', !warm);
  el.bossFill.style.width = '100%';
  el.bossLag.style.width = '100%';
  hudBossHit();
}
function hudBossHit() {
  const f = Math.max(0, B.hp) / Math.max(1, B.maxHp);
  el.bossFill.style.width = (f * 100) + '%';
  el.bossLag.style.width = (f * 100) + '%';
  el.spark.style.setProperty('--w', (f * 100) + '%');
  el.spark.classList.remove('on');
  void el.spark.offsetWidth;                    // restart the sweep animation
  el.spark.classList.add('on');
  el.wave.innerHTML = '<b class="wv">WAVE ' + ((B.plan ? B.plan.index : 0) + 1) + '</b>' +
    Math.ceil(B.hp) + ' / ' + B.maxHp;
}
function hudPlayer() {
  const f = LOGIC.clamp(P.hp / P.maxHp, 0, 1);
  el.pFill.style.width = (f * 100) + '%';
  el.pLag.style.width = (f * 100) + '%';
  el.pTag.textContent = 'HP ' + Math.max(0, Math.round(P.hp));
  el.pPanel.classList.toggle('low', f < 0.34);
}
function hudCombo(n) {
  el.comboN.textContent = '×' + n;
  el.combo.classList.toggle('on', n >= 2);
  if (n >= 2) {
    el.combo.classList.remove('pop');
    void el.combo.offsetWidth;
    el.combo.classList.add('pop');
  }
}
/* Cooldown pies are one CSS variable per slot — cheaper and smoother than
   redrawing anything, and it keeps the timing logic in the pure block. */
function hudCooldowns() {
  for (const btn of el.slots) {
    const a = LOGIC.ACTIONS[btn.dataset.act];
    const f = LOGIC.cdFraction(G.t, P.readyAt[btn.dataset.act], a.cd);
    btn.style.setProperty('--cd', f.toFixed(3));
    btn.classList.toggle('ready', f <= 0);
    btn.classList.toggle('cool', f > 0);
  }
}

/* ================================= sound ================================= */
/* ==== AUDIO-START ==== */
/* Nothing here is downloaded: every sound is built at run time out of
   oscillators and filtered noise, the same way the arena builds its geometry.
   The music is a *pattern*, and the pattern is a pure function of the step
   index — sixteenth 37 will always name the same notes. That is what lets the
   in-page capture (#cap=audio) render the very same pattern into an
   OfflineAudioContext and measure it, rather than anyone having to take my
   word for how it sounds. */
const AUDIO = (() => {
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  let ctx = null, g = null, on = true, element = 'fire', heat = 0.25;
  let step = 0, at = 0, timer = 0, scheduled = 0;

  /* ==== AUDIO-PURE-START ==== */
  /* ---- the score, as data ------------------------------------------------- */
  const BPM = 132, BEAT = 60 / BPM, S16 = BEAT / 4, BAR = 16;
  /* i - VI - III - VII in D minor: the four bars every synthwave track owns. */
  const PROG = [
    { root: 38, tones: [62, 65, 69] },   // Dm
    { root: 34, tones: [58, 62, 65] },   // Bb
    { root: 41, tones: [53, 57, 60] },   // F
    { root: 36, tones: [60, 64, 67] },   // C
  ];
  /* The boss picks the key and the colour of the lead: the demon sits in D,
     the titan a fifth above it with a glassier voice. */
  const KEYS = {
    fire: { shift: 0, lead: 'sawtooth', bell: 0 },
    ice: { shift: 7, lead: 'triangle', bell: 1 },
  };
  const MIDI = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const KICK = [0, 4, 8, 12], SNARE = [4, 12];
  const ARP = [0, 1, 2, 1, 2, 3, 1, 2];      // 3 means "the root, an octave up"

  /* What one sixteenth sounds like, as plain data — no audio objects in here at
     all, which is why tests/audio.test.js can read every bar of it in Node.
     k counts sixteenths from the start of the track; heat is the wave's temper,
     0..1, and it thickens the drums and pushes the lead forward. */
  function stepPlan(k, o) {
    const key = KEYS[o.element] || KEYS.fire, h = o.heat, out = [];
    const bar = Math.floor(k / BAR), s = k % BAR;
    const chord = PROG[bar % PROG.length];
    if (KICK.indexOf(s) >= 0 || (h > 0.35 && s === 14)) out.push({ inst: 'kick', at: 0, gain: 1 });
    if (SNARE.indexOf(s) >= 0) out.push({ inst: 'snare', at: 0, gain: 0.85 });
    if (s % (h > 0.5 ? 1 : 2) === 0)
      out.push({ inst: 'hat', at: 0, gain: s % 4 === 2 ? 0.55 : 0.34, open: s === 14 });
    if (bar % 8 === 7 && s >= 8) out.push({ inst: 'snare', at: 0, gain: 0.22 + (s - 8) * 0.07 });
    if (s % 2 === 0)                                  // eighths, with two lifts
      out.push({ inst: 'bass', at: 0, dur: S16 * 1.7, gain: 0.9,
        midi: chord.root + (s === 6 || s === 14 ? 12 : 0) + key.shift });
    if (s % 2 === 1 || h > 0.55) {                    // the neon lead
      const a = ARP[(k >> 1) % ARP.length];
      out.push({ inst: 'lead', at: 0, dur: S16 * 1.4, gain: 0.2 + h * 0.12,
        midi: chord.tones[a % 3] + 12 + (a === 3 ? 12 : 0) + key.shift });
    }
    if (s === 0)                                      // one pad per bar
      out.push({ inst: 'pad', at: 0, dur: BAR * S16, gain: 0.16 + h * 0.1,
        midis: chord.tones.map((m) => m - 12 + key.shift) });
    return out;
  }
  /* ==== AUDIO-PURE-END ==== */

  /* ---- the graph ---------------------------------------------------------- */
  /* A soft clipper, so a pile-up of voices compresses instead of crackling. */
  const SAT = (() => {
    const n = 2048, c = new Float32Array(n);
    for (let i = 0; i < n; i++) c[i] = Math.tanh(((i / (n - 1)) * 2 - 1) * 1.5) * 0.94;
    return c;
  })();
  /* Every voice is an envelope: quick in, exponential out. The 1e-4 floors are
     not decoration — exponential ramps refuse to touch zero. */
  const env = (c, t, a, d, peak) => {
    const gn = c.createGain();
    gn.gain.setValueAtTime(1e-4, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(1e-4, peak), t + a);
    gn.gain.exponentialRampToValueAtTime(1e-4, t + a + d);
    return gn;
  };
  const panned = (c, p) => {
    const n = c.createStereoPanner();
    if (n.pan) n.pan.value = p || 0;
    return n;
  };

  function graph(c) {
    const bus = c.createGain();                    // every voice lands here
    bus.gain.value = 0.9;
    const musicIn = c.createGain();                // the loop's own fader
    musicIn.gain.value = 0.34;
    const damp = c.createBiquadFilter();           // steps back under a big hit
    damp.type = 'lowpass'; damp.frequency.value = 18000;
    const squash = c.createWaveShaper();
    squash.curve = SAT; squash.oversample = '2x';
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -11; comp.knee.value = 9; comp.ratio.value = 6;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    const out = c.createGain();                    // master: muting ramps this
    out.gain.value = 0.85;
    /* A cheap room: two damped feedback delays rather than a convolver — the
       point is that the arena has a size, not that it is a cathedral. */
    const verbIn = c.createGain(); verbIn.gain.value = 0.9;
    const verbOut = c.createGain(); verbOut.gain.value = 0.5;
    const damp2 = c.createBiquadFilter();
    damp2.type = 'lowpass'; damp2.frequency.value = 3400;
    for (const [dt, fb, wet] of [[0.077, 0.42, 0.6], [0.113, 0.34, 0.5]]) {
      const dl = c.createDelay(1); dl.delayTime.value = dt;
      const f = c.createGain(); f.gain.value = fb;
      const w = c.createGain(); w.gain.value = wet;
      verbIn.connect(dl); dl.connect(f); f.connect(dl); dl.connect(w); w.connect(damp2);
    }
    damp2.connect(verbOut); verbOut.connect(bus);
    musicIn.connect(damp); damp.connect(squash);
    bus.connect(squash); squash.connect(comp); comp.connect(out); out.connect(c.destination);
    /* One seeded noise buffer per context: identical white noise every run,
       which is what makes an off-line render reproducible to the sample. */
    const nz = c.createBuffer(2, Math.ceil(c.sampleRate * 1.5), c.sampleRate);
    const r = LOGIC.mulberry32(0x5eed0);
    for (let ch = 0; ch < 2; ch++) {
      const d = nz.getChannelData(ch);
      for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    }
    return { c, bus, musicIn, damp, out, verbIn, nz };
  }

  /* ---- two voice primitives, and everything else is built from them ------- */
  function noise(g, t, dur, o) {
    const c = g.c, s = c.createBufferSource();
    s.buffer = g.nz; s.loop = true;
    const f = c.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1), t + dur);
    f.Q.value = o.q == null ? 1.1 : o.q;
    const gn = env(c, t, o.a == null ? 0.004 : o.a, dur, o.gain == null ? 0.4 : o.gain);
    const p = panned(c, o.pan);
    s.connect(f); f.connect(gn); gn.connect(p); p.connect(o.to || g.bus);
    s.start(t); s.stop(t + dur + 0.02);
    return gn;
  }
  /* One oscillator. `fm` adds a modulator on the carrier's frequency, which is
     where the bolt's zap and the crystals' ring come from. */
  function osc(g, t, dur, o) {
    const c = g.c, os = c.createOscillator();
    os.type = o.type || 'sawtooth';
    os.frequency.setValueAtTime(Math.max(1, o.f), t);
    if (o.f1) os.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + (o.sweep || dur));
    if (o.detune) os.detune.value = o.detune;
    let tail = os;
    if (o.lp) {
      const f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp1) f.frequency.exponentialRampToValueAtTime(Math.max(80, o.lp1), t + dur);
      f.Q.value = o.q == null ? 0.9 : o.q;
      os.connect(f); tail = f;
    }
    if (o.fm) {
      const m = c.createOscillator(); m.type = 'sine'; m.frequency.value = o.fm;
      const mg = c.createGain();
      mg.gain.setValueAtTime(o.fmi || 400, t);
      mg.gain.exponentialRampToValueAtTime(1, t + dur);
      m.connect(mg); mg.connect(os.frequency);
      m.start(t); m.stop(t + dur + 0.02);
    }
    const gn = env(c, t, o.a == null ? 0.006 : o.a, dur, o.gain == null ? 0.35 : o.gain);
    const p = panned(c, o.pan);
    tail.connect(gn); gn.connect(p); p.connect(o.to || g.bus);
    if (o.rev) { const rv = c.createGain(); rv.gain.value = o.rev; p.connect(rv); rv.connect(g.verbIn); }
    os.start(t); os.stop(t + dur + 0.03);
    return gn;
  }

  /* ---- the five players in the band --------------------------------------- */
  const INST = {
    kick(g, t, o) {
      const c = g.c, os = c.createOscillator();
      os.type = 'sine';
      os.frequency.setValueAtTime(150, t);
      os.frequency.exponentialRampToValueAtTime(42, t + 0.13);
      const gn = env(c, t, 0.003, 0.4, 0.95 * o.gain);
      os.connect(gn); gn.connect(g.bus);
      os.start(t); os.stop(t + 0.6);
      noise(g, t, 0.03, { type: 'highpass', f: 2000, gain: 0.16 * o.gain });   // the beater
    },
    snare(g, t, o) {
      noise(g, t, 0.17, { type: 'bandpass', f: 1900, f1: 800, q: 0.9, gain: 0.46 * o.gain });
      const c = g.c, os = c.createOscillator();
      os.type = 'triangle';
      os.frequency.setValueAtTime(190, t);
      os.frequency.exponentialRampToValueAtTime(120, t + 0.09);
      const gn = env(c, t, 0.002, 0.12, 0.3 * o.gain);
      os.connect(gn); gn.connect(g.bus); os.start(t); os.stop(t + 0.25);
    },
    hat(g, t, o) {
      /* 8.2kHz left almost nothing to hear; a hat has to sit above the lead
         without disappearing, so it lives at 6.8k and carries a little more. */
      noise(g, t, o.open ? 0.2 : 0.045, { type: 'highpass', f: 6800, q: 0.7,
        gain: (o.open ? 0.36 : 0.26) * o.gain, pan: 0.18 });
    },
    bass(g, t, o) {
      const f = MIDI(o.midi);
      osc(g, t, o.dur, { type: 'sawtooth', f, lp: 2600, lp1: 240, q: 5, gain: 0.28 * o.gain });
      osc(g, t, o.dur * 1.1, { type: 'sine', f: f / 2, gain: 0.32 * o.gain });   // the sub
    },
    lead(g, t, o) {
      const f = MIDI(o.midi), key = KEYS[element] || KEYS.fire;
      osc(g, t, o.dur, { type: key.lead, f, lp: 2600 + 2600 * heat, q: 3,
        gain: 0.22 * o.gain, pan: -0.32, rev: 0.22, detune: -8 });
      osc(g, t, o.dur, { type: key.lead, f, lp: 2600 + 2600 * heat, q: 3,

  /* ---- the fight's own noises --------------------------------------------- */

    slash(g, t, o) {                       // air first, then the metal

    heavy(g, t, o) {

      osc(g, t, 0.4, { type: 'sine', f: 130, f1: 42, sweep: 0.4, gain: 0.55 });

      noise(g, t, 0.17, { type: 'bandpass', f: i ? 700 : 420, f1: 200, q: 1.2, gain: 0.3, pan: p });
      osc(g, t, 0.2, { type: 'sine', f: i ? 280 : 160, f1: i ? 110 : 68, gain: 0.36 });
      if (i) osc(g, t, 0.5, { type: 'sine', f: 3140, gain: 0.07, rev: 0.5 });
    },
    crit(g, t, o) {                        // the same blow, wearing a crown
      SFX.hit(g, t, o);
      osc(g, t, 0.7, { type: 'sine', f: 1660, gain: 0.15, rev: 0.6 });
      osc(g, t, 0.6, { type: 'triangle', f: 2490, detune: 12, gain: 0.09, rev: 0.6 });
      noise(g, t, 0.3, { type: 'highpass', f: 5200, gain: 0.14, pan: o.pan || 0 });
    },
    boltCast(g, t, o) {                    // the charge before it leaves your hand

    bolt(g, t, o) {                        // the zap itself: frequency modulation spits

      noise(g, t, 0.22, { type: 'bandpass', f: 2600, f1: 700, q: 1.4, gain: 0.24, pan: p });
      osc(g, t, 0.3, { type: 'triangle', f: 92, f1: 46, gain: 0.28 });
    },
    hurt(g, t, o) {

      noise(g, t, 0.34, { type: 'lowpass', f: 1800, f1: 300, gain: 0.3 });
      osc(g, t, 0.4, { type: 'sawtooth', f: 300, f1: 90, lp: 1400, q: 3, gain: 0.18 });

    dodge(g, t, o) {

      osc(g, t, 0.2, { type: 'triangle', f: 900, f1: 300, gain: 0.07, pan: p });
    },
    avoid(g, t, o) {                       // you read the warning and stepped out of it

      osc(g, t, 0.5, { type: 'sine', f: MIDI(86 + k), gain: 0.14, rev: 0.6 });
      osc(g, t, 0.4, { type: 'sine', f: MIDI(93 + k), gain: 0.09, rev: 0.6 });

    warn(g, t, o) {                        // three rising blips: the 1.5s the rule gives you

          q: 4, gain: 0.15, pan: p });

         so the riser swells all the way to the strike instead of decaying under
         it: measured, that is the difference between 0.0002 and 0.02 rms when
         the boss finally swings. */
      noise(g, t, 1.5, { type: 'bandpass', f: 500, f1: 3600, q: 1.1, gain: 0.3, a: 1.25, pan: p });
      osc(g, t, 1.45, { type: 'sawtooth', f: MIDI(base - 24), lp: 300, q: 3, gain: 0.16,
        a: 0.25, rev: 0.3 });
    },
    combo(g, t, o) {                       // the streak climbing, one semitone at a time

        gain: 0.13, rev: 0.4 });
    },
    wave(g, t, o) {                        // a new boss walks in
      const key = KEYS[element] || KEYS.fire;
      noise(g, t, 0.6, { type: 'bandpass', f: 400, f1: 5200, q: 0.7, gain: 0.24, a: 0.35 });
      osc(g, t, 0.7, { type: 'sawtooth', f: 120, f1: 980, lp: 2600, q: 3, gain: 0.22,
        a: 0.4, rev: 0.35 });
      osc(g, t + 0.55, 0.9, { type: 'sine', f: 62, f1: 34, sweep: 0.5, gain: 0.6 });
      for (const m of PROG[0].tones)
        osc(g, t + 0.55, 1.2, { type: 'sawtooth', f: MIDI(m - 12 + key.shift), lp: 1100,
          q: 1.4, gain: 0.12, a: 0.04, rev: 0.5 });

    kill(g, t, o) {
      const i = isIce();
      noise(g, t, 1.2, { type: 'lowpass', f: 3000, f1: 200, q: 0.8, gain: 0.46, a: 0.01 });
      osc(g, t, 1.4, { type: 'sine', f: i ? 300 : 220, f1: 30, sweep: 1, gain: 0.75 });
      osc(g, t, 0.5, { type: 'sawtooth', f: 160, f1: 40, lp: 2200, q: 4, gain: 0.36 });
      noise(g, t + 0.05, 1.4, { type: 'bandpass', f: i ? 3800 : 2600, f1: 600, q: 0.7,
        gain: 0.2, rev: 0.6 });
      osc(g, t + 0.3, 1.6, { type: 'sine', f: MIDI((i ? 69 : 62) + 24), gain: 0.1, rev: 0.7 });
    },
    victory(g, t, o) {
      const k = (KEYS[element] || KEYS.fire).shift;
      [62, 65, 69, 74].forEach((m, i) => {
        const d = 0.9 - i * 0.1;

          gain: 0.18, rev: 0.45 });
        osc(g, t + i * 0.14, d * 1.4, { type: 'sine', f: MIDI(m + 12 + k), gain: 0.07, rev: 0.6 });
      });
      osc(g, t, 1.6, { type: 'sine', f: MIDI(38 + k), a: 0.05, gain: 0.36 });
    },
    defeat(g, t, o) {
      const k = (KEYS[element] || KEYS.fire).shift;
      [62, 58, 53].forEach((m, i) =>
        osc(g, t + i * 0.3, 1.2, { type: 'sawtooth', f: MIDI(m + k), lp: 900, lp1: 200,
          q: 2, gain: 0.2, rev: 0.6 }));
      osc(g, t, 3.2, { type: 'sine', f: MIDI(26), a: 0.06, gain: 0.45, rev: 0.4 });
      noise(g, t, 1.6, { type: 'lowpass', f: 900, f1: 120, gain: 0.22, a: 0.4 });
    },
    heal(g, t, o) {
      osc(g, t, 0.5, { type: 'sine', f: MIDI(69), gain: 0.15, rev: 0.5 });
      osc(g, t + 0.1, 0.7, { type: 'sine', f: MIDI(76), gain: 0.12, rev: 0.5 });
    },
    ui(g, t, o) {

    },

  /* ---- the outside world -------------------------------------------------- */
  /* Building the context is deferred until a gesture: browsers will not let a
     page make noise before one, and a suspended context is just a leak. */
  function setGain(v) {
    if (g) g.out.gain.setTargetAtTime(v, g.c.currentTime, 0.03);
  }

    if (g || !AC) return g;
    try {
      ctx = new AC();
      g = graph(ctx);
      setGain(on ? 0.85 : 0);
    } catch (e) { g = null; ctx = null; }
    return g;
  }
  /* One sixteenth of the score, played into a graph — the same call the live
     pump makes and the same call #cap=audio makes, off-line, to measure it. */
  function voiceStep(gg, k, t) {

    for (const n of notes) INST[n.inst](gg, t + n.at, n);
    scheduled++;                       // proof the live loop is really running
  }

    if (!g) return;
    const t = g.c.currentTime, ahead = t + 0.2;
    if (at < t) { at = t + 0.04; step = 0; }          // first tick, or after a stall
    while (at < ahead) { voiceStep(g, step, at); step++; at += S16; }
  }

  }

  function play(name, o) {
    const fn = SFX[name];
    if (!fn || !g || !on) return false;
    if (ctx.state !== 'running' && ctx.resume) ctx.resume();
    fn(g, g.c.currentTime + 0.008, Object.assign({ element, pan: 0 }, o));
    return true;
  }
  function unlock() {
    if (!AC || !build()) return false;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();

  function setOn(v) { on = !!v; setGain(on ? 0.85 : 0); if (!on) music(false); else if (g) music(true); paint(); }
  /* A big hit takes the music down a notch: you should hear the crunch, not

  function duck(amount, dur) {
    if (!g) return;
    const t = g.c.currentTime;
    g.damp.frequency.cancelScheduledValues(t);
    g.damp.frequency.setTargetAtTime(16000 - 14600 * amount, t, 0.02);
    g.damp.frequency.setTargetAtTime(18000, t + dur, 0.09);

  }

  /* ---- the button --------------------------------------------------------- */
  /* idle = no context yet (nothing can play until you touch something),
     on = playing, off = muted. Repainting only on change keeps the 60fps path
     from touching the DOM. */
  const btn = typeof document !== 'undefined' && document.getElementById('snd');

    const live = !!g && !!ctx && ctx.state === 'running';
    const cls = !live ? 'idle' : (on ? 'on' : 'off');

    addEventListener(ev, () => { if (!g) unlock(); else paint(); }, { once: true, passive: true });

  addEventListener('visibilitychange', () => {
    if (!g) return;
    if (document.hidden) { music(false); if (ctx.suspend) ctx.suspend(); }
    else { if (ctx.resume) ctx.resume(); music(on); }
    paint();
  });
  paint();

  return {
    unlock, play, setOn, duck, swell, setElement, setHeat, tick: paint, music,
    muted: () => !on, live: () => !!g && !!ctx && ctx.state === 'running',
    notes: () => scheduled, state: () => (ctx ? ctx.state : 'off'),
    /* The half the capture harness and tests/audio.test.js reach for: the score
       as data, and the two calls that turn data into sound. */
    stepPlan, voiceStep, graph, insts: INST, sfx: SFX, midi: MIDI,
    grid: { BPM, BEAT, S16, BAR, PROG, KEYS, KICK, SNARE, ARP },

})();

/* ================================= input ================================= */
/* Keyboard for the desk, big friendly buttons for the sofa. */
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
  if (e.repeat) return;
  if (k === 'arrowleft' || k === 'a') tryMove(-1);
  else if (k === 'arrowright' || k === 'd') tryMove(1);
  else if (k === 'j' || k === ' ') tryAttack('quick');
  else if (k === 'k') tryAttack('heavy');
  else if (k === 'l') tryAttack('bolt');
  else if (k === 'm') AUDIO.setOn(AUDIO.muted());
  else if (k === 'r' || k === 'enter') { if (G.state === 'defeat') newRun(); }
});
function tap(node, fn) {
  node.addEventListener('pointerdown', (e) => { e.preventDefault(); node.classList.add('down'); fn(); });
  for (const up of ['pointerup', 'pointercancel', 'pointerleave'])
    node.addEventListener(up, () => node.classList.remove('down'));
}
for (const btn of el.slots) tap(btn, () => tryAttack(btn.dataset.act));
tap(document.getElementById('dL'), () => tryMove(-1));
tap(document.getElementById('dR'), () => tryMove(1));
addEventListener('pointerdown', () => { if (G.state === 'defeat') newRun(); });
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });

/* ================================ camera ================================= */
/* One rig, never cut. It orbits on its own slow clock, leans toward whichever
   side the player commits to, and rides the trauma. The aim sits between the
   two fighters so both silhouettes stay in frame. */
/* Composition: the camera sits three-quarters behind the player, not straight
   behind him — from directly behind, his own cape hides the entire character. */
/* Composition: three-quarters behind the player, and *inside* the ring of
   pillars — at 10.8 the orbit put a pillar between the lens and the fight.
   Portrait phones get a wider lens and a little more room, or the fight
   overflows the frame and the HUD eats the player. */
const lensFov = () => (innerWidth < innerHeight ? 64 : 48);
const lensRoom = () => (innerWidth < innerHeight ? 1.3 : 1);
/* A narrow frame wants the two fighters lined up, not shot across. */
const lensTheta = () => (innerWidth < innerHeight ? 0.34 : 0.58);
const camRig = { theta: 0.58, dist: 8.7, height: 5.5, aim: new THREE.Vector3(0, 1.8, 0.4) };
const _aim = new THREE.Vector3();
function updateCamera(dt, rt) {
  const dead = G.state === 'defeat';
  camRig.theta = LOGIC.damp(camRig.theta,
    lensTheta() + 0.2 * Math.sin(rt * 0.1) + P.x * 0.04, 0.9, dt);
  camRig.dist = LOGIC.damp(camRig.dist,
    (dead ? 10.6 : 8.7) * lensRoom() + trauma * 0.7, 1.5, dt);
  camRig.height = LOGIC.damp(camRig.height, (dead ? 6.8 : 5.5) * lensRoom(), 1.5, dt);
  _aim.set(P.x * 0.24, 1.85, BZ * 0.3 + 1.1);
  camRig.aim.lerp(_aim, 1 - Math.exp(-2.4 * dt));
  const s = trauma * trauma;
  const jx = (Math.random() - 0.5) * 0.6 * s, jy = (Math.random() - 0.5) * 0.6 * s,
    jz = (Math.random() - 0.5) * 0.45 * s;
  camera.position.set(Math.sin(camRig.theta) * camRig.dist + jx,
    camRig.height + jy, Math.cos(camRig.theta) * camRig.dist + jz);
  camera.lookAt(camRig.aim.x, camRig.aim.y + jy * 0.4, camRig.aim.z);
  camera.rotation.z += (Math.random() - 0.5) * 0.055 * s;
  camera.fov = LOGIC.damp(camera.fov, lensFov() + s * 4.5, 5, dt);
  camera.updateProjectionMatrix();
}

/* ================================= loop ================================== */
let last0 = 0, frames = 0, msSum = 0, avgMs = 16.7, lastScale = 1;

function step(dtRaw) {
  const raw = LOGIC.clamp(dtRaw, 0, 0.05);
  const dt = scaledDt(raw);
  /* The score steps back as the world slows down: slow motion should sound
     slow, and a big hit should not have to fight an arpeggio for room. */
  if (Math.abs(timeScale - lastScale) > 0.01) { lastScale = timeScale; AUDIO.swell(timeScale); }
  G.t += dt;
  if (G.state === 'fight') G.runT += dt;
  updatePlayer(dt, G.t);
  updateBoss(dt);
  updateFx(dt, G.t, raw);
  updateShards(dt);
  hudCooldowns();
  const c = LOGIC.comboTick(G.combo, G.t, G.lastHit);
  if (c !== G.combo) { G.combo = c; hudCombo(c); }
  updateCamera(raw, G.t);
}

function draw() { renderer.info.reset(); composer.render(); }
function frame(now) {
  const t0 = performance.now();
  step((now - last0) / 1000);
  last0 = now;
  draw();
  msSum += performance.now() - t0;
  frames++;
  avgMs = msSum / Math.max(1, frames);
  if (frames === 1 || frames % 10 === 0) {
    /* A trickle of live state into a hidden node: enough to diagnose a build
       that is actually running, with no console and no extra pixels on screen. */
    document.getElementById('probe').textContent = JSON.stringify({
      t: +G.t.toFixed(1), state: G.state, boss: B.def ? B.def.id : null, bhp: Math.round(B.hp),
      php: Math.round(P.hp), phase: B.st ? B.st.phase : null, dist: +camRig.dist.toFixed(2),
      flash: +flashAmt.toFixed(3), vig: +vigAmt.toFixed(3), trauma: +trauma.toFixed(2),
      ts: +timeScale.toFixed(2), calls: renderer.info.render.calls, ms: +avgMs.toFixed(1),
      errs: errs.length,
    });
    /* The sound button only repaints when its state changes, so this is free. */
    AUDIO.tick();
  }
  requestAnimationFrame(frame);
}

/* ================================= boot ================================== */
/* The real start-up runs at the very bottom of this file, once every binding

/* ================================= probe ================================= */
/* Headless verification. A WebGL scene is awkward to test, so the trick is to
   drive the game from a fixed timestep with a seeded PRNG and then read numbers
   back out — including pixels, so "it glows" becomes a measurement rather than
   an opinion. Everything lands as JSON in #probe and window.__probe. */
function lumaProbe() {
  const gl = renderer.getContext();
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  const w = Math.max(2, Math.floor(W * 0.5)), h = Math.max(2, Math.floor(H * 0.4));
  const x = Math.floor((W - w) / 2), y = Math.floor((H - h) / 2);
  const buf = new Uint8Array(w * h * 4);
  gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  let sum = 0, bright = 0, sat = 0;
  for (let i = 0; i < buf.length; i += 4) {
    const r = buf[i] / 255, g = buf[i + 1] / 255, b = buf[i + 2] / 255;
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    sum += l;
    if (l > 0.7) bright++;
    sat += Math.max(r, g, b) - Math.min(r, g, b);
  }
  const n = buf.length / 4;
  return { meanLuma: +(sum / n).toFixed(3), brightFrac: +(bright / n).toFixed(4),
    meanSat: +(sat / n).toFixed(3) };
}
/* A NaN anywhere in the graph is the classic silent killer of a 3D app —
   one bad divide and the fighter vanishes. Walk everything and check. */
function nanScan() {
  let bad = 0, count = 0;
  scene.traverse((o) => {
    count++;
    const p = o.position, s = o.scale;
    if (![p.x, p.y, p.z, s.x, s.y, s.z].every(Number.isFinite)) bad++;
  });
  return { objects: count, nanObjects: bad };
}
function report(extra) {
  const info = renderer.info.render;
  const ns = nanScan();
  const j = Object.assign({
    mode: CAP.mode, seed: CAP.seed, state: G.state,
    boss: B.def ? B.def.id : null, bossHp: Math.round(B.hp), bossMax: B.maxHp,
    phase: B.st ? B.st.phase : null, playerHp: Math.round(P.hp), side: P.side,
    x: +P.x.toFixed(2), combo: G.combo, best: G.best, slain: G.slain,
    hits: G.hits, dodges: G.dodges, calls: info.calls, tris: info.triangles,
    objects: ns.objects, nanObjects: ns.nanObjects,
    timeScale: +timeScale.toFixed(2), avgMs: +avgMs.toFixed(2), errors: errs,
  }, extra || {});
  const txt = JSON.stringify(j);
  document.getElementById('probe').textContent = txt;
  document.title = 'probe · ' + CAP.mode + ' · ' + G.state;
  window.__probe = j;
  return j;
}

  lumaProbe, nanScan, report, AUDIO, heatOf,
  get avgMs() { return avgMs; },
  set avgMs(v) { avgMs = v; },
  get timeScale() { return timeScale; },
};

newRun();
camera.fov = lensFov();          // right lens for the very first frame
camera.updateProjectionMatrix();
if (CAP.mode) {
  /* Loaded on demand, so the game never ships a line of test harness. */
  import('./tests/capture.js')
    .then((m) => m.runCapture(window.__duel, CAP.mode))
    .catch((e) => { boot.style.display = 'none'; report({ loadError: String(e.message || e) }); });
} else {
  boot.style.display = 'none';
  last0 = performance.now();
  requestAnimationFrame(frame);
}

</script>
