<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DUEL — a 3D boss battle</title>
<meta name="description" content="A stylized low-poly 3D boss battle: read the telegraphed strike, dodge, cut, cast. One HTML file, Three.js.">
<style>
/* ==========================================================================
   NEON DUEL — interface.
   Dark glass panels, hairline neon rules, glowing type. Everything floats
   over one full-bleed WebGL canvas, so no element here paints a background
   larger than it needs to.
   ========================================================================== */
:root{
  --ink:#04050c;
  --cyan:#6ff2ff; --cyan-dim:#1b5f70;
  --magenta:#ff4fd8; --gold:#ffd166;
  --red:#ff3b52; --ice:#5fd0ff; --fire:#ff6a1e;
  --glass:rgba(10,15,28,.52);
  --line:rgba(120,220,255,.26);
  --font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);color:#eaf6ff;
  font:400 13px/1.4 var(--font);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;
  cursor:crosshair}
canvas{display:block;position:fixed;inset:0}

/* ---- shared bits ---------------------------------------------------------- */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(180,240,255,.07)}
.label{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.62}
.glow{text-shadow:0 0 12px currentColor,0 0 34px currentColor}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}

/* ---- boss, top ------------------------------------------------------------ */
#hudTop{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:min(680px,92vw);padding:11px 15px 13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bossName{font-size:14px;letter-spacing:.15em;font-weight:600;flex:1 1 auto;min-width:0;
  transition:color .4s}
#bossName b{font-weight:600}
#bossName .ttl{font-style:normal;font-weight:400;opacity:.72}
#bossTag{display:flex;align-items:center;gap:7px;flex:0 0 auto}
#bossDot{width:7px;height:7px;border-radius:50%;background:var(--fire);
  box-shadow:0 0 10px 2px currentColor;color:var(--fire)}
#bossWave{font-size:9.5px;letter-spacing:.2em;opacity:.55}
#bossWave .wv{font-weight:600}
#bossWave .wv::after{content:" · "}
.bar{position:relative;height:11px;border-radius:6px;overflow:hidden;margin-top:8px;
  background:rgba(3,6,14,.86);border:1px solid rgba(150,220,255,.16)}
.bar .lag,.bar .fill{position:absolute;inset:0 auto 0 0;width:100%;
  border-radius:5px;transform-origin:left}
.bar .lag{background:rgba(255,90,110,.5);transition:width .55s cubic-bezier(.2,.7,.3,1) .12s}
.bar .fill{transition:width .12s linear}
#bossHpFill{background:linear-gradient(90deg,#ff7a2f,#ff3b52 70%,#ff8fd0)}
#bossHpFill.ice{background:linear-gradient(90deg,#4fb8ff,#8fe7ff 70%,#d6f6ff)}
#bossBar.hit{animation:barHit .22s}
@keyframes barHit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.spark{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  opacity:0;transform:translateX(-40px)}
.spark.on{animation:sweep .5s ease-out}
@keyframes sweep{from{opacity:.9;transform:translateX(-40px)}
  to{opacity:0;transform:translateX(var(--w,400px))}}

/* ---- player, bottom ------------------------------------------------------- */
#hudBottom{position:absolute;bottom:14px;left:0;right:0;display:flex;
  align-items:flex-end;justify-content:space-between;gap:14px;padding:0 16px}
#pPanel{flex:0 1 300px;padding:10px 13px 12px;min-width:190px}
#pHpFill{background:linear-gradient(90deg,#2ee6a8,#7ff0ff 75%,#d8fbff)}
#pPanel.low #pHpFill{background:linear-gradient(90deg,#ff5a6e,#ffb03a)}
#pName{font-size:12px;letter-spacing:.2em}
#hint{font-size:9px;letter-spacing:.12em;opacity:.5;margin-top:7px;white-space:nowrap}

/* ---- attack slots --------------------------------------------------------- */
#keys{display:flex;gap:10px}
.slot{position:relative;width:62px;height:62px;flex:none;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:grid;place-items:center;color:#cdf3ff;cursor:pointer;
  transition:transform .09s ease,border-color .2s,box-shadow .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(180,240,255,.07)}
.slot:active,.slot.down{transform:translateY(2px) scale(.96)}
.slot .glyph{font-size:24px;line-height:1;filter:drop-shadow(0 0 8px currentColor)}
.slot .key{position:absolute;top:4px;left:7px;font-size:9px;letter-spacing:.1em;opacity:.6}
.slot .nm{position:absolute;bottom:4px;left:0;right:0;text-align:center;
  font-size:7.5px;letter-spacing:.12em;opacity:.55}
.slot .cost{position:absolute;top:4px;right:6px;font-size:8.5px;opacity:.5}
.slot .cd{position:absolute;inset:0;pointer-events:none;border-radius:13px;
  background:conic-gradient(from 0deg,rgba(2,5,12,.84) calc(var(--cd,0) * 360deg),transparent 0)}
.slot[data-act=quick]{color:#9df5ff;border-color:rgba(110,240,255,.4)}
.slot[data-act=heavy]{color:#ffd166;border-color:rgba(255,209,102,.4)}
.slot[data-act=bolt]{color:#e79dff;border-color:rgba(231,157,255,.4)}
.slot.ready{box-shadow:0 0 18px -2px currentColor,0 10px 30px rgba(0,0,0,.5)}
.slot.ready::after{content:"";position:absolute;inset:0;border-radius:14px;
  border:1px solid currentColor;opacity:0;animation:readyPulse 1.6s ease-out infinite}
@keyframes readyPulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
.slot.cool{filter:saturate(.35) brightness(.72)}

/* ---- touch controls ------------------------------------------------------- */
#dpad{display:none;gap:10px}
#dpad button{width:62px;height:62px;font-size:22px;color:#bff0ff;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(9px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dpad button:active{transform:translateY(2px) scale(.96);color:#fff}
body.touch #dpad{display:flex}
body.touch #hint{display:none}

/* ---- combo ---------------------------------------------------------------- */
#combo{position:absolute;top:96px;left:50%;transform:translate(-50%,0) scale(.6);
  text-align:center;opacity:0;transition:opacity .18s}
#combo.on{opacity:1}
#comboN{font-size:40px;font-weight:700;color:var(--gold);line-height:.9}
#comboL{font-size:9px;letter-spacing:.34em;color:#ffe6a8;opacity:.85}
#combo.pop{animation:pop .26s ease-out}
@keyframes pop{0%{transform:translate(-50%,0) scale(1.42)}100%{transform:translate(-50%,0) scale(1)}}

/* ---- floating damage ------------------------------------------------------ */
#dmgLayer{position:absolute;inset:0;overflow:hidden}
.dmg{position:absolute;font-size:17px;font-weight:700;transform:translate(-50%,-50%);
  color:#fff;text-shadow:0 0 10px currentColor,0 2px 6px rgba(0,0,0,.9);will-change:transform,opacity}
.dmg.crit{font-size:29px;color:var(--gold)}
.dmg.hurt{color:#ff6b7d}
.dmg.magic{color:#e7a6ff}

/* ---- banners & overlays --------------------------------------------------- */
#banner{position:absolute;top:32%;left:0;right:0;text-align:center;opacity:0;
  transition:opacity .3s;pointer-events:none!important}
#banner.on{opacity:1}
#banner b{display:block;font-size:clamp(30px,7vw,62px);letter-spacing:.16em;font-weight:700}
#banner i{display:block;font-style:normal;font-size:11px;letter-spacing:.3em;
  opacity:.8;margin-top:6px}
#banner.win b{color:var(--gold);text-shadow:0 0 26px #ffb43c,0 0 70px #ff7a1e}
#banner.lose b{color:var(--red);text-shadow:0 0 26px #ff3355,0 0 70px #7a0020}
#banner.wave b{color:var(--cyan);text-shadow:0 0 26px #35dfff,0 0 70px #0d6a8c}
#over{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle at 50% 45%,rgba(4,6,14,.55),rgba(3,4,10,.93));
  opacity:0;pointer-events:none!important;transition:opacity .45s}
#over.on{opacity:1}
#over h1{font-size:clamp(34px,8vw,74px);letter-spacing:.2em;font-weight:700}
#over.win h1{color:var(--gold);text-shadow:0 0 30px #ffb43c,0 0 90px #ff7300}
#over.lose h1{color:var(--red);text-shadow:0 0 30px #ff3355,0 0 90px #8a0022}
#over p{margin-top:12px;font-size:11px;letter-spacing:.26em;opacity:.75}
#over .stats{margin-top:20px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
#over .stats div{min-width:96px}
#over .stats b{display:block;font-size:22px;color:var(--cyan)}
#over .again{margin-top:26px;font-size:12px;letter-spacing:.28em;color:#fff;
  animation:blink 1.7s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---- sound toggle --------------------------------------------------------- */
/* Sits in the one corner nothing else wants: top-left on a desk, just under
   the boss panel on a phone (where the dpad owns the bottom-left). Until a
   gesture has let the audio context start it breathes, so the first thing a
   player sees is that there is something to press. */
#snd{position:fixed;top:15px;left:15px;width:34px;height:34px;z-index:7;
  display:grid;place-items:center;font-size:15px;line-height:1;color:#8fdcff;
  background:var(--glass);border:1px solid var(--line);border-radius:11px;cursor:pointer;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(180,240,255,.07);
  transition:color .25s,border-color .25s}
#snd:active{transform:translateY(1px) scale(.95)}
#snd.idle{color:#7d93a6;border-color:rgba(150,200,225,.34);
  animation:sndNudge 2.4s ease-in-out infinite}
@keyframes sndNudge{0%,100%{box-shadow:0 8px 26px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 16px -2px currentColor,0 8px 26px rgba(0,0,0,.5)}}
#snd.on{color:#9ff0ff;text-shadow:0 0 10px currentColor}
#snd.off{color:#57697a}
#snd .slash{position:absolute;width:26px;height:2px;border-radius:2px;background:#ff5d75;
  box-shadow:0 0 8px #ff5d75;transform:rotate(-45deg);opacity:0;transition:opacity .2s}
#snd.off .slash{opacity:1}

/* ---- full-screen feedback ------------------------------------------------- */
#vig,#flash{position:fixed;inset:0;pointer-events:none!important;z-index:6;opacity:0}
#vig{background:radial-gradient(ellipse at 50% 52%,transparent 52%,rgba(255,20,50,.62) 100%)}
#flash{mix-blend-mode:screen;background:#fff}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  z-index:9;background:var(--ink);color:#cfefff;gap:10px}
#boot small{display:block;opacity:.6;margin-top:10px;font-size:10.5px;letter-spacing:.16em}
#probe{display:none}

/* ---- narrow screens ------------------------------------------------------- */
@media(max-width:700px){
  #hudTop{width:94vw;top:10px;padding:9px 12px 11px}
  /* The name and the wave tag together are wider than a phone: let the name
     shrink and the row wrap, instead of pushing the HP bar off the screen. */
  #hudTop .row{flex-wrap:wrap;gap:2px 8px}
  #bossName{font-size:10.5px;letter-spacing:.08em;flex:1 1 auto;min-width:0}
  #bossName .ttl{display:none}          /* the title is the first thing to go */
  #bossTag{flex:0 0 auto}
  #hudBottom{flex-wrap:wrap;gap:10px;padding:0 10px 10px}
  #pPanel{order:-1;flex:1 1 100%;min-width:0}
  #keys .slot,#dpad button{width:56px;height:56px}
  #combo{top:104px}
  /* The phone puts the boss panel across the top, so the sound button drops
     below it — still clear of the combo counter, which is centred. */
  #snd{top:76px;left:10px}
}
@media(max-width:420px){
  /* A narrow phone has to fit a dodge pad and three attacks side by side. */
  #keys{gap:7px}
  #dpad{gap:7px}
  #keys .slot,#dpad button{width:48px;height:48px;border-radius:11px}
  .slot .glyph{font-size:19px}
  .slot .nm{font-size:6.5px;letter-spacing:.06em}
  #bossWave{font-size:8.5px;letter-spacing:.1em}
  #bossWave .wv{display:none}          /* "240 / 240" fits where "WAVE 9 · …" does not */
}
</style>
</head>
<body>
<div id="hud">
  <section id="hudTop" class="panel">
    <div class="row">
      <span id="bossName" class="glow"><b></b><i class="ttl"></i></span>
      <span id="bossTag"><span id="bossWave"></span><span id="bossDot"></span></span>
    </div>
    <div class="bar" id="bossBar">
      <div class="lag" id="bossHpLag"></div>
      <div class="fill" id="bossHpFill"></div>
      <div class="spark" id="bossSpark"></div>
    </div>
  </section>
  <div id="combo"><div id="comboN">×2</div><div id="comboL">COMBO</div></div>
  <div id="dmgLayer"></div>
  <div id="hudBottom">
    <div id="dpad">
      <button id="dL" aria-label="Dodge left">◀</button>
      <button id="dR" aria-label="Dodge right">▶</button>
    </div>
    <section id="pPanel" class="panel">
      <div class="row"><span id="pName">YOU</span><span id="pTag" class="label">HP 100</span></div>
      <div class="bar" id="pBar">
        <div class="lag" id="pHpLag"></div>
        <div class="fill" id="pHpFill"></div>
      </div>
      <div id="hint">← → / A D DODGE &nbsp;·&nbsp; J SLASH &nbsp;K STRIKE &nbsp;L BOLT &nbsp;·&nbsp; M MUTE</div>
    </section>
    <div id="keys">
      <button class="slot" data-act="quick" aria-label="Quick slash">
        <span class="cd"></span><span class="key">J</span><span class="glyph">⚔</span><span class="nm">SLASH</span></button>
      <button class="slot" data-act="heavy" aria-label="Heavy strike">
        <span class="cd"></span><span class="key">K</span><span class="glyph">✦</span><span class="nm">STRIKE</span></button>
      <button class="slot" data-act="bolt" aria-label="Magic bolt">
        <span class="cd"></span><span class="key">L</span><span class="glyph">✸</span><span class="nm">BOLT</span></button>
    </div>
  </div>
</div>
<button id="snd" class="idle" aria-label="Sound" aria-pressed="false">♪<i class="slash"></i></button>
<div id="banner"><b>VICTORY</b><i></i></div>
<div id="over"><h1>DEFEATED</h1><div class="stats"></div><div class="again">PRESS R &nbsp;/&nbsp; TAP TO RISE</div></div>
<div id="vig"></div><div id="flash"></div>
<div id="boot">SYNTHESISING ARENA
  <small>loading three.js from CDN…<br>music and sound start on your first key or tap</small></div>
<div id="probe"></div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==== PURE-LOGIC-START ==== */
/* Every rule of the fight lives in here: no DOM, no three.js, no globals.
   tests/logic.test.js lifts this block straight out of the HTML and exercises
   it in Node, which is why the interesting half of the game is testable at all. */
const LOGIC = (() => {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  /* Frame-rate independent smoothing: damp(a,b,8,dt) covers the same ground
     whether dt arrives as one 1s step or sixty 1/60s steps. */
  const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

  /* Small, fast, seedable PRNG. Deterministic captures and tests both need it. */
  function mulberry32(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), s | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---- the three moves --------------------------------------------------- */
  const ACTIONS = {
    quick: { dmg: 9,  cd: 0.42, windup: 0.10, hit: 0.16, kind: 'slash' },
    heavy: { dmg: 26, cd: 3.20, windup: 0.30, hit: 0.42, kind: 'heavy' },
    bolt:  { dmg: 14, cd: 1.30, windup: 0.14, hit: 0.22, kind: 'magic' },
  };

  /* ---- the two bosses ---------------------------------------------------- */
  const BOSSES = [
    { id: 'demon', name: 'PYROTH',  title: 'THE FLAME DEMON', hp: 240, dmg: 18,
      telegraph: 1.5, strikeHold: 0.5, recover: 1.75, windup: 0.55 },
    { id: 'ice',   name: 'KRYOS',   title: 'THE ICE TITAN',   hp: 270, dmg: 22,
      telegraph: 1.5, strikeHold: 0.6, recover: 1.95, windup: 0.70 },
  ];

  /* Never the same boss twice in a row, so a run always shows both faces. */
  function rollBoss(rng, lastId) {
    const pool = BOSSES.filter((b) => b.id !== lastId);
    return pool[Math.floor(rng() * pool.length) % pool.length];
  }

  /* Each kill makes the next boss meaner: more HP, shorter recovery, heavier
     hits. Telegraph time is deliberately NOT scaled — 1.5s stays readable. */
  function planFor(def, index) {
    return {
      def, index, hp: Math.round(def.hp * (1 + 0.12 * index)),
      dmg: def.dmg + index, telegraph: def.telegraph, strikeHold: def.strikeHold,
      recover: Math.max(0.62, def.recover - 0.09 * index), windup: def.windup,
    };
  }

  /* ---- sides ------------------------------------------------------------- */
  const sideOf = (x) => (x < 0 ? 'left' : 'right');
  const otherSide = (s) => (s === 'left' ? 'right' : 'left');
  /* The whole fight in one line: you are safe on the side the boss is not. */
  const isSafe = (attackSide, playerSide) => attackSide !== playerSide;

  /* ---- damage ------------------------------------------------------------ */
  /* Combo builds a small multiplier, capped so it never trivialises the fight. */
  const comboMult = (combo, step = 0.03, cap = 10) => 1 + Math.min(combo, cap) * step;
  const CRIT_CHANCE = 0.18, CRIT_MULT = 1.9;

  function hitFor(move, combo, rng) {
    const a = ACTIONS[move];
    const crit = rng() < CRIT_CHANCE;
    const raw = a.dmg * comboMult(combo) * (crit ? CRIT_MULT : 1);
    return { move, crit, amount: Math.max(1, Math.round(raw)) };
  }

  /* Hits taken ignore the combo multiplier — only the boss's own damage. */
  const incoming = (dmg, hp) => Math.max(0, hp - dmg);

  /* ---- combo bookkeeping ------------------------------------------------- */
  const COMBO_WINDOW = 2.5;
  const comboTick = (combo, t, lastHit, window = COMBO_WINDOW) =>
    (t - lastHit > window ? 0 : combo);
  const comboAfterHit = (combo, t, lastHit, window = COMBO_WINDOW) =>
    (t - lastHit > window ? 1 : combo + 1);

  /* ---- cooldowns --------------------------------------------------------- */
  const readyAt = (now, cd) => now + cd;
  const isReady = (now, at) => now >= at;
  const cdFraction = (now, at, cd) => clamp((at - now) / cd, 0, 1);

  /* ---- the boss attack state machine ------------------------------------- */
  /* idle -> telegraph (1.5s of warning) -> strike (resolve) -> idle.
     s is a plain object so this can run in a test just as well as on screen. */
  function bossInit(plan, rng) {
    return { phase: 'idle', t: 0, side: 'left', plan, rng, strikes: 0 };
  }
  function bossStep(s, dt) {
    const ev = [];
    s.t += dt;
    if (s.phase === 'idle') {
      if (s.t >= s.plan.recover) {
        s.phase = 'telegraph'; s.t = 0;
        s.side = s.rng() < 0.5 ? 'left' : 'right';
        ev.push({ type: 'telegraph', side: s.side });
      }
    } else if (s.phase === 'telegraph') {
      if (s.t >= s.plan.telegraph) {
        s.phase = 'strike'; s.t = 0; s.strikes++;
        ev.push({ type: 'strike', side: s.side });
      }
    } else if (s.phase === 'strike') {
      if (s.t >= s.plan.strikeHold) {
        s.phase = 'idle'; s.t = 0; ev.push({ type: 'recover' });
      }
    }
    return ev;
  }
  /* How far through the warning we are, 0..1 — drives the ground zone's pulse. */
  const telegraphT = (s) => (s.phase === 'telegraph' ? clamp(s.t / s.plan.telegraph, 0, 1) : 0);

  return { clamp, lerp, damp, mulberry32, ACTIONS, BOSSES, rollBoss, planFor, sideOf,
    otherSide, isSafe, comboMult, hitFor, incoming, CRIT_CHANCE, CRIT_MULT,
    COMBO_WINDOW, comboTick, comboAfterHit, readyAt, isReady, cdFraction,
    bossInit, bossStep, telegraphT };
})();
/* ==== PURE-LOGIC-END ==== */

/* Tuning for everything you can see. Kept out of the logic block on purpose:
   that block is rules, this is taste. */
const CFG = {
  arena: 9.2,           // floor radius
  slot: 2.65,           // how far either side a dodge commits you
  pz: 2.75, bz: -1.95,  // player and boss resting Z
  playerHp: 100,
  seed: 20260214,
};
const errs = [];
window.addEventListener('error', (e) => errs.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errs.push('promise: ' + e.reason));
/* #cap=<mode>&seed=<n> pins a deterministic frame, for verification. */
const CAP = (() => {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  const mode = h.get('cap') || (q.has('cap') ? q.get('cap') : null);
  const seed = parseInt(h.get('seed') || q.get('seed') || CFG.seed, 10);

/* A tiny procedural studio, filtered by PMREM. Without an environment the
   metal and crystal would be black holes; with it, one canvas lights the world. */
function makeEnv() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 128);
  sky.addColorStop(0.00, '#04060e'); sky.addColorStop(0.45, '#0a1636');
  sky.addColorStop(0.62, '#15406b'); sky.addColorStop(0.70, '#0a0f1c');
  sky.addColorStop(1.00, '#020308');
  g.fillStyle = sky; g.fillRect(0, 0, 256, 128);
  const panel = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  panel(16, 40, 30, 12, '#8ff7ff'); panel(112, 34, 24, 14, '#ff63dd');
  panel(196, 44, 26, 10, '#eaf8ff'); panel(64, 96, 90, 6, '#123a55');
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer);
  const env = pm.fromEquirectangular(t).texture;

}

/* Neon rings + spokes, drawn as lines: cheap, crisp, unmistakably a game. */

}

/* ============================== effects =================================== */
/* One additive Points cloud serves every burst, spark, debris chunk and
   sparkle in the game. Particles are integrated on the CPU and written
   straight into the buffer; dead slots are given size 0, so they cost nothing
   on the GPU. Custom attribute names (aColor/aSize) keep the shader clear of
   anything three's own prefix might declare. */
const MAXP = 1500;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3), pSize = new Float32Array(MAXP);
const pVel = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP);
const pGrav = new Float32Array(MAXP), pDrag = new Float32Array(MAXP), pGrow = new Float32Array(MAXP);
const pBaseR = new Float32Array(MAXP), pBaseG = new Float32Array(MAXP), pBaseB = new Float32Array(MAXP);
let pCursor = 0;

const pGeo = new THREE.BufferGeometry();
const dyn = THREE.DynamicDrawUsage;
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(dyn));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3).setUsage(dyn));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1).setUsage(dyn));
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 aColor; attribute float aSize; varying vec3 vC;
    void main(){
      vC = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (300.0 / max(0.001, -mv.z));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vC;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d); a *= a;   // soft round dot
      gl_FragColor = vec4(vC * a, 1.0);            // additive: rgb is the whole story
    }`,
});
const pointCloud = new THREE.Points(pGeo, pMat);
pointCloud.frustumCulled = false;
scene.add(pointCloud);

/* o = {x,y,z,count,color,speed,spread,size,size1,life,grav,drag,dir:[x,y,z],up} */
function burst(o) {
  const c = new THREE.Color(o.color || 0xffffff);
  const n = o.count || 12, spd = o.speed == null ? 4 : o.speed;
  const spread = o.spread == null ? 1 : o.spread, life = o.life || 0.7;
  const s0 = o.size || 0.16, s1 = o.size1 == null ? 0 : o.size1;
  const dir = o.dir, up = o.up || 0;
  for (let k = 0; k < n; k++) {
    const i = pCursor; pCursor = (pCursor + 1) % MAXP;
    const i3 = i * 3;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    let vx = Math.sin(ph) * Math.cos(th), vy = Math.cos(ph) * 0.7 + up, vz = Math.sin(ph) * Math.sin(th);
    if (dir) { vx = vx * spread + dir[0]; vy = vy * spread + dir[1]; vz = vz * spread + dir[2]; }
    else { vx *= spread; vy *= spread; vz *= spread; }
    const m = spd * (0.55 + Math.random() * 0.85);
    pPos[i3] = o.x + vx * 0.18; pPos[i3 + 1] = o.y + vy * 0.18; pPos[i3 + 2] = o.z + vz * 0.18;
    pVel[i3] = vx * m; pVel[i3 + 1] = vy * m; pVel[i3 + 2] = vz * m;
    const j = 0.75 + Math.random() * 0.5;
    pBaseR[i] = c.r * j; pBaseG[i] = c.g * j; pBaseB[i] = c.b * j;
    pSize[i] = s0 * (0.6 + Math.random() * 0.8);
    pMax[i] = pLife[i] = life * (0.7 + Math.random() * 0.6);
    pGrav[i] = o.grav == null ? -5.5 : o.grav;
    pDrag[i] = o.drag == null ? 1.4 : o.drag;
    pGrow[i] = s1;
  }
}

/* Ambient embers: a persistent field that drifts up and wraps around, so the
   arena always has something alive in the dark. */
const EMB = 240;
const embPos = new Float32Array(EMB * 3), embCol = new Float32Array(EMB * 3), embSize = new Float32Array(EMB);
const embVel = new Float32Array(EMB * 3);
for (let i = 0; i < EMB; i++) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R;
  embPos[i * 3] = Math.cos(a) * r; embPos[i * 3 + 1] = Math.random() * 7; embPos[i * 3 + 2] = Math.sin(a) * r;
  const warm = Math.random() < 0.7;
  const c = new THREE.Color(warm ? 0xff8a3c : 0x63e6ff);
  embCol[i * 3] = c.r; embCol[i * 3 + 1] = c.g; embCol[i * 3 + 2] = c.b;
  embSize[i] = 0.05 + Math.random() * 0.09;
  embVel[i * 3] = (Math.random() - 0.5) * 0.16;
  embVel[i * 3 + 1] = 0.22 + Math.random() * 0.5;
  embVel[i * 3 + 2] = (Math.random() - 0.5) * 0.16;
}
const embGeo = new THREE.BufferGeometry();
embGeo.setAttribute('position', new THREE.BufferAttribute(embPos, 3).setUsage(dyn));
embGeo.setAttribute('aColor', new THREE.BufferAttribute(embCol, 3).setUsage(dyn));
embGeo.setAttribute('aSize', new THREE.BufferAttribute(embSize, 1).setUsage(dyn));
const embers = new THREE.Points(embGeo, pMat);
embers.frustumCulled = false;
scene.add(embers);

/* ---- expanding ground rings (shockwaves, impacts, spawn pulses) ---------- */
const ringGeo = new THREE.RingGeometry(0.58, 1, 48);
const ringPool = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff,
    transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  world.add(m);
  ringPool.push({ m, t: 1, life: 0.6, r0: 0.6, r1: 7, tilt: 0 });
}
/* o = {x,z,y,color,r0,r1,life,tilt} — a scaled annulus reads as a shockwave
   because its thickness grows with its radius, exactly like a real one. */
function ring(o) {
  let s = ringPool.find((p) => p.t >= 1);
  if (!s) s = ringPool[0];
  s.t = 0;
  s.life = o.life == null ? 0.55 : o.life;
  s.r0 = o.r0 == null ? 0.5 : o.r0;
  s.r1 = o.r1 == null ? 7 : o.r1;
  s.tilt = o.tilt || 0;
  s.m.material.color.set(o.color == null ? 0xffffff : o.color);
  s.m.position.set(o.x || 0, o.y == null ? 0.035 : o.y, o.z || 0);
  s.m.rotation.set(-Math.PI / 2 + s.tilt, 0, 0);
  s.m.visible = true;
  return s;
}

/* ---- slash crescents: one sector, reused for every sweep in the game ----- */
/* A sector centred on local +x, so aiming a crescent is just a yaw. */
const arcGeo = new THREE.RingGeometry(0.4, 1, 40, 1, -0.7, 1.4);
const arcPool = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(arcGeo, new THREE.MeshBasicMaterial({ color: 0xffffff,
    transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide }));
  m.visible = false;
  world.add(m);
  arcPool.push({ m, t: 1, life: 0.4, r0: 1, r1: 3.2, flat: 1 });
}
/* o = {x,y,z,yaw,color,r0,r1,life,flat} */
function arc(o) {
  let s = arcPool.find((p) => p.t >= 1);
  if (!s) s = arcPool[0];
  s.t = 0;
  s.life = o.life == null ? 0.35 : o.life;
  s.r0 = o.r0 == null ? 0.8 : o.r0;
  s.r1 = o.r1 == null ? 3.4 : o.r1;
  s.flat = o.flat == null ? 1 : o.flat;
  s.m.material.color.set(o.color == null ? 0xffffff : o.color);
  s.m.position.set(o.x || 0, o.y == null ? 1.1 : o.y, o.z || 0);
  s.m.rotation.set(-Math.PI / 2 * s.flat, 0, 0);
  s.m.rotateY(o.yaw || 0);
  s.m.visible = true;
  return s;
}

/* ---- magic bolts: a travelling sphere, its light, and a trail ------------ */
const boltMat = new THREE.MeshBasicMaterial({ color: 0xdcbcff });
const boltGeo = new THREE.SphereGeometry(0.2, 12, 10);
const bolts = [];
function bolt(o) {
  const m = new THREE.Mesh(boltGeo, boltMat.clone());
  m.material.color.set(o.color || 0xc79bff);
  const light = new THREE.PointLight(o.color || 0xc79bff, 26, 9, 2);
  m.add(light);
  scene.add(m);
  bolts.push({ m, light, from: o.from.clone(), to: o.to.clone(), t: 0,
    dur: o.dur || 0.34, arc: o.arc == null ? 0.9 : o.arc, color: o.color || 0xc79bff,
    onHit: o.onHit });
}
function updateBolts(dt) {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.t += dt / b.dur;
    const u = Math.min(1, b.t);
    const p = new THREE.Vector3().lerpVectors(b.from, b.to, u);
    p.y += Math.sin(u * Math.PI) * b.arc;
    b.m.position.copy(p);
    /* sparkle trail: a couple of motes shed every frame */
    burst({ x: p.x, y: p.y, z: p.z, count: 2, color: b.color, speed: 1.1,
      spread: 0.4, size: 0.13, life: 0.34, grav: 1.2, drag: 2.4 });
    b.m.scale.setScalar(1 + Math.sin(b.t * 32) * 0.08);
    if (u >= 1) {
      burst({ x: p.x, y: p.y, z: p.z, count: 26, color: b.color, speed: 7,
        spread: 0.9, size: 0.22, life: 0.55, grav: -2, drag: 1.6 });
      ring({ x: p.x, z: p.z, y: p.y, color: b.color, r0: 0.35, r1: 3, life: 0.4, tilt: 0 });
      scene.remove(b.m); b.m.material.dispose();
      bolts.splice(i, 1);
      if (b.onHit) b.onHit(p);
    }
  }
}

/* ---- floating damage numbers (DOM text stays crisp at any zoom) ---------- */
const dmgLayer = document.getElementById('dmgLayer');
const dmgPool = [];
const tmpV = new THREE.Vector3();
function dmgNumber(o) {
  let d = dmgPool.find((p) => !p.on);
  if (!d) {
    if (dmgPool.length >= 28) d = dmgPool[0];
    else { d = { el: document.createElement('div'), on: false }; dmgLayer.appendChild(d.el); dmgPool.push(d); }
  }
  d.on = true; d.t = 0; d.life = o.life || 0.95;
  d.v = o.value; d.spin = (Math.random() - 0.5) * 26;
  d.x = o.x; d.y = o.y; d.z = o.z;
  d.el.textContent = (o.crit ? '' : '') + o.value + (o.crit ? '!' : '');
  d.el.className = 'dmg' + (o.crit ? ' crit' : '') + (o.hurt ? ' hurt' : '') + (o.magic ? ' magic' : '');
  d.el.style.opacity = '1';
}
function updateNumbers(dt) {
  for (const d of dmgPool) {
    if (!d.on) continue;
    d.t += dt;
    if (d.t >= d.life) { d.on = false; d.el.style.opacity = '0'; continue; }
    const u = d.t / d.life;
    tmpV.set(d.x, d.y + u * 1.5, d.z).project(camera);
    if (tmpV.z > 1) { d.el.style.opacity = '0'; continue; }
    const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    const pop = 1 + Math.max(0, 1 - u * 6) * 0.5;
    d.el.style.transform = `translate(-50%,-50%) translate(${sx}px,${sy}px) scale(${pop}) rotate(${d.spin * u}deg)`;
    d.el.style.opacity = String(Math.min(1, (1 - u) * 3));
  }
}
/* A hit spark: the shape of the burst tells you what kind of blow landed. */
function hitSpark(pos, color, big) {
  burst({ x: pos.x, y: pos.y, z: pos.z, count: big ? 34 : 16, color, speed: big ? 9 : 5.5,
    spread: 1, size: big ? 0.26 : 0.17, life: big ? 0.7 : 0.45, grav: -4, drag: 1.8 });
  ring({ x: pos.x, z: pos.z, y: pos.y, color, r0: 0.25, r1: big ? 4.4 : 1.9, life: big ? 0.45 : 0.3 });
}

/* ---- camera trauma, slow motion, hit-stop and screen flash --------------- */
let trauma = 0, timeScale = 1, scaleTarget = 1, scaleHold = 0, hitstop = 0;
let flashAmt = 0;
const flashEl = document.getElementById('flash'), vigEl = document.getElementById('vig');
let vigAmt = 0;
const shake = (a) => { trauma = Math.min(1.25, trauma + a); };
const slowmo = (s, dur) => { scaleTarget = s; scaleHold = dur; };
const hitStop = (t) => { hitstop = Math.max(hitstop, t); };
const flash = (a) => { flashAmt = Math.max(flashAmt, a); };
const vignette = (a) => { vigAmt = Math.max(vigAmt, a); };

/* Gameplay runs on scaled time; screens and camera run on real time, so a
   slow-motion beat never stalls the interface or strands a white flash.
   The clamping matters more than it looks: a frame delta can arrive as zero or
   even negative (rAF timestamps may precede the clock read at start-up), and a
   negative dt would run every decay in this file backwards. */
function scaledDt(raw) {
  if (scaleHold > 0) scaleHold -= raw; else scaleTarget = 1;
  let target = scaleTarget;
  if (hitstop > 0) { hitstop -= raw; target = 0.05; }
  timeScale = LOGIC.damp(timeScale, target, 15, raw);
  return raw * timeScale;
}

/* ---- deferred one-shots: hit timing, spawn delays, victory beats --------- */
const timers = [];
const after = (t, fn) => timers.push({ t, fn });
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const x = timers[i];
    x.t -= dt;
    if (x.t <= 0) { timers.splice(i, 1); x.fn(); }
  }
}
const clearTimers = () => { timers.length = 0; };

/* ---- per-frame effect update -------------------------------------------- */
function updateParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    const i3 = i * 3;
    if (pLife[i] <= 0) { if (pSize[i] !== 0) pSize[i] = 0; continue; }
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pSize[i] = 0; pCol[i3] = pCol[i3 + 1] = pCol[i3 + 2] = 0; continue; }
    const d = Math.exp(-pDrag[i] * dt);
    pVel[i3] *= d; pVel[i3 + 2] *= d;
    pVel[i3 + 1] = pVel[i3 + 1] * d + pGrav[i] * dt;
    pPos[i3] += pVel[i3] * dt; pPos[i3 + 1] += pVel[i3 + 1] * dt; pPos[i3 + 2] += pVel[i3 + 2] * dt;
    if (pPos[i3 + 1] < 0.03 && pGrav[i] < 0) {      // debris skitters instead of sinking
      pPos[i3 + 1] = 0.03;
      pVel[i3 + 1] *= -0.34;
      pVel[i3] *= 0.7; pVel[i3 + 2] *= 0.7;
    }
    const f = (pLife[i] / pMax[i]) ** 2;            // fade out fast at the end
    pCol[i3] = pBaseR[i] * f; pCol[i3 + 1] = pBaseG[i] * f; pCol[i3 + 2] = pBaseB[i] * f;
    pSize[i] = Math.max(0, pSize[i] + pGrow[i] * dt);
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
}
function updateEmbers(dt, t) {
  for (let i = 0; i < EMB; i++) {
    const i3 = i * 3;
    embPos[i3] += (embVel[i3] + Math.sin(t * 0.7 + i) * 0.07) * dt;
    embPos[i3 + 1] += embVel[i3 + 1] * dt;
    embPos[i3 + 2] += (embVel[i3 + 2] + Math.cos(t * 0.5 + i) * 0.07) * dt;
    if (embPos[i3 + 1] > 7.4) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R;
      embPos[i3 + 1] = -0.2;
      embPos[i3] = Math.cos(a) * r; embPos[i3 + 2] = Math.sin(a) * r;
    }
  }
  embGeo.attributes.position.needsUpdate = true;
}
/* Rings and crescents share one shape of animation: grow, thin out, vanish. */
function updatePooled(dt, pool) {
  for (const s of pool) {
    if (s.t >= 1) { if (s.m.visible) s.m.visible = false; continue; }
    s.t = Math.min(1, s.t + dt / s.life);
    const e = 1 - (1 - s.t) ** 2;                   // ease-out expansion
    const r = s.r0 + (s.r1 - s.r0) * e;
    s.m.scale.setScalar(r);
    s.m.material.opacity = (1 - s.t) ** 1.6;
  }
}
function updateFx(dt, t, rt) {
  updateParticles(dt);
  updateEmbers(dt, t);
  updateBolts(dt);
  updatePooled(dt, ringPool);
  updatePooled(dt, arcPool);
  updateNumbers(dt);
  updateTimers(dt);
  /* These three are screen furniture, so they always run on real time. */
  trauma = Math.max(0, trauma - rt * 1.7);
  flashAmt = Math.max(0, flashAmt - rt * 4.5);
  flashEl.style.opacity = flashAmt > 0.003 ? String(Math.min(0.5, flashAmt)) : '0';
  vigAmt = Math.max(0, vigAmt - rt * 1.8);
  vigEl.style.opacity = vigAmt > 0.003 ? String(Math.min(0.7, vigAmt)) : '0';
}

/* ================================ the cape ================================ */
/* A verlet cloth grid pinned along the shoulders. Not a simulation of fabric
   — it is a 5x8 lattice with distance constraints, which is exactly enough to
   lag behind a dodge and settle on its own. Everything runs in player-local
   space, so the player can turn on the spot without the cape noticing. */
const CW = 5, CH = 8;                       // vertices
const CAPE_W = 0.66, CAPE_H = 1.24;         // narrow enough that he still reads as a person
const capeGeo = new THREE.PlaneGeometry(CAPE_W, CAPE_H, CW - 1, CH - 1);
const capeCur = new Float32Array(CW * CH * 3), capePrev = new Float32Array(CW * CH * 3);
const capeRest = new Float32Array(CW * CH * 3);
const rH = CAPE_W / (CW - 1), rV = CAPE_H / (CH - 1);
const capeLinks = [];
for (let iy = 0; iy < CH; iy++) for (let ix = 0; ix < CW; ix++) {
  const i = iy * CW + ix, i3 = i * 3;
  /* rest pose: a shallow curve, so the cloth already hangs the right way */
  capeRest[i3] = -CAPE_W / 2 + ix * rH;
  capeRest[i3 + 1] = 1.44 - iy * rV;
  capeRest[i3 + 2] = 0.19 + Math.abs(ix / (CW - 1) - 0.5) * 0.1 + iy * 0.012;
  capeCur.set(capeRest.subarray(i3, i3 + 3), i3);
  capePrev.set(capeRest.subarray(i3, i3 + 3), i3);
  if (ix < CW - 1) capeLinks.push([i, i + 1, rH, 1]);
  if (iy < CH - 1) capeLinks.push([i, i + CW, rV, 1]);
  if (ix < CW - 1 && iy < CH - 1) {
    const d = Math.hypot(rH, rV);
    capeLinks.push([i, i + CW + 1, d, 0.4]);   // shear, to stop the lattice
    capeLinks.push([i + 1, i + CW, d, 0.4]);   // collapsing into a rhombus
  }
}
/* A navy-to-cyan gradient baked into vertex colours: the hem catches the light
   and blooms, which is what sells the cloth as magic rather than laundry. */
const capeCol = new Float32Array(CW * CH * 3);
for (let iy = 0; iy < CH; iy++) for (let ix = 0; ix < CW; ix++) {
  const i = (iy * CW + ix) * 3, t = iy / (CH - 1);
  capeCol[i] = 0.04 + t * 0.16; capeCol[i + 1] = 0.07 + t * 0.32; capeCol[i + 2] = 0.22 + t * 0.36;
}
capeGeo.setAttribute('color', new THREE.BufferAttribute(capeCol, 3));
const cape = new THREE.Mesh(capeGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, side: THREE.DoubleSide, roughness: 0.62, metalness: 0.25,
  emissive: 0x0d2a6a, emissiveIntensity: 0.45, envMapIntensity: 0.7 }));
cape.castShadow = true;
cape.frustumCulled = false;
P.group.add(cape);

const _q = new THREE.Quaternion(), _vl = new THREE.Vector3();
function capeUpdate(dt, t) {
  const h = Math.min(dt, 1 / 45), h2 = h * h;
  /* The player's own velocity, expressed in local space: the cloth feels it as
     a wind blowing the other way. This is the whole "physics" in one line. */
  _q.copy(P.group.quaternion).invert();
  _vl.copy(P.vworld).applyQuaternion(_q);
  for (let i = 0; i < CW * CH; i++) {
    const i3 = i * 3;
    if (i < CW) {                                   // shoulder row is pinned
      capeCur.set(capeRest.subarray(i3, i3 + 3), i3);
      capePrev.set(capeRest.subarray(i3, i3 + 3), i3);
      continue;
    }
    for (let c = 0; c < 3; c++) {
      const cur = capeCur[i3 + c], prev = capePrev[i3 + c];
      let a = -_vl.getComponent(c) * 2.1;
      if (c === 1) a -= 11.5;                                    // gravity
      else if (c === 2) a += 1.1 + Math.sin(t * 1.4 + i * 0.4) * 0.3;  // breeze, plus a shiver
      capePrev[i3 + c] = cur;
      capeCur[i3 + c] = cur + (cur - prev) * 0.985 + a * h2;
    }
  }
  for (let it = 0; it < 3; it++) {
    for (let k = 0; k < capeLinks.length; k++) {
      const [a, b, rest, stiff] = capeLinks[k];
      const a3 = a * 3, b3 = b * 3;
      const dx = capeCur[b3] - capeCur[a3], dy = capeCur[b3 + 1] - capeCur[a3 + 1],
        dz = capeCur[b3 + 2] - capeCur[a3 + 2];
      const d = Math.hypot(dx, dy, dz) || 1e-6;
      const f = ((d - rest) / d) * 0.5 * stiff;
      if (a >= CW) { capeCur[a3] += dx * f; capeCur[a3 + 1] += dy * f; capeCur[a3 + 2] += dz * f; }
      if (b >= CW) { capeCur[b3] -= dx * f; capeCur[b3 + 1] -= dy * f; capeCur[b3 + 2] -= dz * f; }
    }
    for (let i = CW; i < CW * CH; i++) {
      const i3 = i * 3;
      if (capeCur[i3 + 2] < 0.045) capeCur[i3 + 2] = 0.045;   // it never cuts through his back
      if (capeCur[i3 + 1] < 0.06) capeCur[i3 + 1] = 0.06;     // nor sweeps the floor
    }
  }
  const pos = capeGeo.attributes.position;
  pos.array.set(capeCur);
  pos.needsUpdate = true;
  capeGeo.computeVertexNormals();
}

/* ============================ weapon ribbon =============================== */
/* The classic sword trail, made by threading a strip through the last few
   samples of the blade instead of spawning any geometry. Samples are taken in
   world space and aged out, so the ribbon keeps the arc the blade actually
   drew through the air. */
const RIB_N = 16, RIB_LIFE = 0.22;
const ribPos = new Float32Array(RIB_N * 2 * 3), ribCol = new Float32Array(RIB_N * 2 * 3);
const ribGeo = new THREE.BufferGeometry();
ribGeo.setAttribute('position', new THREE.BufferAttribute(ribPos, 3).setUsage(dyn));
ribGeo.setAttribute('color', new THREE.BufferAttribute(ribCol, 3).setUsage(dyn));
const ribIdx = [];
for (let i = 0; i < RIB_N - 1; i++) { const a = i * 2; ribIdx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
ribGeo.setIndex(ribIdx);
ribGeo.setDrawRange(0, 0);
const ribbon = new THREE.Mesh(ribGeo, new THREE.MeshBasicMaterial({ vertexColors: true,
  transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
ribbon.frustumCulled = false;
scene.add(ribbon);
const ribPts = [];
const ribA = new THREE.Vector3(), ribB = new THREE.Vector3();
let ribTint = new THREE.Color(0x9ff0ff);

function ribbonUpdate(dt, from, to, tint) {
  if (tint) ribTint.copy(tint);
  if (from && to) {
    /* Only accept a sample once the tip has moved: otherwise the strip
       collapses into a dot when the blade hangs still. */
    const last = ribPts[0];
    if (!last || last.a.distanceToSquared(from) > 3e-4) {
      ribPts.unshift({ a: from.clone(), b: to.clone(), age: 0 });
      if (ribPts.length > RIB_N) ribPts.length = RIB_N;
    }
  }
  for (const p of ribPts) p.age += dt;
  while (ribPts.length && ribPts[ribPts.length - 1].age > RIB_LIFE) ribPts.pop();
  const n = ribPts.length;
  if (n < 2) { ribGeo.setDrawRange(0, 0); return; }
  for (let i = 0; i < n; i++) {
    const p = ribPts[i], i6 = i * 6;
    ribPos[i6] = p.a.x; ribPos[i6 + 1] = p.a.y; ribPos[i6 + 2] = p.a.z;
    ribPos[i6 + 3] = p.b.x; ribPos[i6 + 4] = p.b.y; ribPos[i6 + 5] = p.b.z;
    const f = Math.max(0, 1 - p.age / RIB_LIFE) ** 1.7;
    ribCol[i6] = ribTint.r * f; ribCol[i6 + 1] = ribTint.g * f; ribCol[i6 + 2] = ribTint.b * f;
    ribCol[i6 + 3] = ribCol[i6] * 0.55; ribCol[i6 + 4] = ribCol[i6 + 1] * 0.55; ribCol[i6 + 5] = ribCol[i6 + 2] * 0.55;
  }
  ribGeo.attributes.position.needsUpdate = true;
  ribGeo.attributes.color.needsUpdate = true;
  ribGeo.setDrawRange(0, (n - 1) * 6);
}

/* ================================ the boss ================================ */
/* Both bosses are assembled from the same handful of parts and exposed through
   the same names (armL/armR/head/torso, plus cores and orbiters), so every

function bossLimb(side, y, w, skin, hot) {

/* A fan of spikes pointing out and up off a shoulder joint, not a scatter of
   cones floating in the air beside the body. */
function spikes(n, r, h, mat, x, y, z, spread) {
  const out = x < 0 ? -1 : 1;
  for (let i = 0; i < n; i++) {
    const a = (i / (n - 1 || 1) - 0.5) * spread;
    const s = mesh(new THREE.ConeGeometry(r, h, 5), mat);
    s.position.set(x + out * Math.abs(a) * 0.14, y + a * 0.16, z);
    s.rotation.set(-0.3 + a * 0.6, 0, out * (0.8 - Math.abs(a) * 0.5));
    B.group.add(s);
  }
}

function buildDemon() {
  /* A dark crust with hot light inside it: if the whole body glows, the
     silhouette dissolves into an orange blob and stops being scary. */
  const skin = new THREE.MeshStandardMaterial({ color: 0x1b0805, emissive: 0x8f2000,
    emissiveIntensity: 0.32, roughness: 0.62, metalness: 0.35, flatShading: true });
  const hot = new THREE.MeshStandardMaterial({ color: 0x1d0703, emissive: 0xff8c1e,
    emissiveIntensity: 1.8, roughness: 0.5, metalness: 0.2, flatShading: true });

  const flameM = new THREE.MeshBasicMaterial({ color: 0xff6a12, transparent: true, opacity: 0.13,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

  bossLeg(-1, skin, hot); bossLeg(1, skin, hot);
  const torso = mesh(new THREE.IcosahedronGeometry(0.95, 1), skin);
  torso.position.y = 2.0; torso.scale.set(0.94, 1.12, 0.88);

  /* Three slim shells read as fire licking off the body; at this opacity they
     hug the silhouette instead of stacking into one white-hot ball. */
  for (let i = 0; i < 3; i++) {
    const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.98, 1), flameM.clone());
    f.position.y = 2.0;
    f.scale.set(1 + i * 0.07, 1.05 + i * 0.07, 1 + i * 0.07);
    f.rotation.set(i, i * 2, i * 3);
    B.group.add(f);
    B.flames.push({ m: f, seed: i * 2.1 });
  }
  const head = mesh(new THREE.IcosahedronGeometry(0.52, 0), skin);
  head.position.y = 3.05; head.scale.set(1, 0.95, 0.92);

    e.scale.set(1, 0.7, 0.6);
    B.eyes.add(e);
  }
  const eyeLight = new THREE.PointLight(0xff3c00, 16, 7, 2);
  eyeLight.position.set(0, 3.0, 0.5);

    h2.position.set(s * 0.62, 3.9, -0.24); h2.rotation.set(-0.95, 0, s * 1.2);
    B.group.add(h1, h2);

  B.parts.armL = bossLimb(-1, 2.46, 0.22, skin, hot);

  B.parts.head = head; B.parts.torso = torso;
